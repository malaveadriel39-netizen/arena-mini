<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d1f">
<title>Arena Mini</title>
<meta name="description" content="Juegos de acción para 2 personas en el mismo celular: Bomba Loca, Duelo Espacial y Hockey Neón.">
<meta property="og:title" content="Arena Mini — reta a un amigo en el mismo celular">
<meta property="og:description" content="Bomba Loca, Duelo Espacial y Hockey Neón. Sin descargar nada.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d1f;--bg2:#141735;--panel:#1b1f42;--line:rgba(255,255,255,.1);--ink:#fff;--dim:#a3a8d4;
  --p1:#ff5a5f;--p2:#3da9fc;--gold:#ffd23f;--ok:#3ddc84;--ac:#9b5cff;
  --disp:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;--body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{font-family:var(--body);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation;
  background:radial-gradient(120% 60% at 50% -10%,#2a2f6b 0%,var(--bg) 60%) fixed}
#app{position:fixed;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.wrap{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0;letter-spacing:.01em}
p{margin:0;line-height:1.45}
.dim{color:var(--dim)}.center{text-align:center}.grow{flex:1}
.logo{font-family:var(--disp);font-size:54px;line-height:.9;text-align:center;letter-spacing:.02em;text-shadow:0 5px 0 rgba(0,0,0,.35)}
.logo .a{color:var(--p1)}.logo .b{color:var(--gold)}.logo .c{color:var(--p2)}.logo .d{color:#2ec4b6}
.logo small{display:block;font-size:30px;color:#fff;letter-spacing:.35em;margin-top:4px;padding-left:.35em}
.btn{appearance:none;border:0;cursor:pointer;font:400 22px var(--disp);letter-spacing:.03em;color:#fff;background:var(--ac);border-radius:18px;padding:17px 20px;
  box-shadow:0 6px 0 rgba(0,0,0,.35),inset 0 -4px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;gap:10px;width:100%;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.green{background:#20b774}.btn.gold{background:var(--gold);color:#2a2100}.btn.ghost{background:var(--panel);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.btn:focus-visible,.gcard:focus-visible,.back:focus-visible{outline:3px solid #fff;outline-offset:3px}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.back{appearance:none;border:0;background:var(--panel);color:#fff;border-radius:12px;padding:10px 14px;font:800 14px var(--body);cursor:pointer}
.label{font:900 12px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px}
/* rivalidad */
.rival{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:12px 14px}
.rival .pl{display:flex;flex-direction:column;gap:2px}.rival .pl:last-child{text-align:right}
.rival .nm{font:400 20px var(--disp)}.rival .w{font:800 12px var(--body);color:var(--dim)}
.rival .vs{font:400 30px var(--disp);letter-spacing:.04em}
.rival button{grid-column:1/-1;appearance:none;border:0;background:transparent;color:var(--dim);font:800 13px var(--body);text-decoration:underline;cursor:pointer;padding:2px}
/* tarjetas de juego */
.gcard{appearance:none;border:0;color:#fff;text-align:left;width:100%;cursor:pointer;display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:center;
  padding:12px;border-radius:24px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 7px 0 rgba(0,0,0,.35),inset 0 -5px 0 rgba(0,0,0,.15);transition:transform .08s}
.gcard:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.gcard svg{width:112px;height:112px;display:block;border-radius:18px}
.gcard h3{font-size:27px;line-height:1}
.gcard p{font:800 14px/1.3 var(--body);opacity:.92;margin-top:6px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tags span{font:900 11px var(--body);letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.25);padding:4px 8px;border-radius:8px}
/* info */
.hero{display:flex;gap:14px;align-items:center}
.hero svg{width:96px;height:96px;flex:none;border-radius:18px}
.hero h2{font-size:36px;line-height:1}
.steps{display:grid;gap:10px}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:var(--panel);border-radius:16px;padding:12px 14px}
.step b.n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ac);font:400 18px var(--disp)}
.step p{font-weight:700}
.goal{background:linear-gradient(90deg,rgba(255,210,63,.18),rgba(255,210,63,.05));border:1px solid rgba(255,210,63,.35);border-radius:16px;padding:12px 14px;font-weight:800}
.phone{display:block;margin:0 auto;width:170px;height:auto}
.setup{display:flex;gap:10px;align-items:center;background:var(--bg2);border-radius:16px;padding:10px 12px;font-weight:800;font-size:14px}
.setup svg{flex:none}
.stick{position:sticky;bottom:0;padding:12px 0 4px;margin-top:4px;background:linear-gradient(transparent,var(--bg) 35%)}
.or{display:flex;align-items:center;gap:10px;color:var(--dim);font:800 13px var(--body)}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.codein{width:100%;background:var(--bg2);border:2px solid var(--line);border-radius:16px;color:#fff;font:400 44px var(--disp);letter-spacing:.35em;text-align:center;padding:10px 0 10px .35em;text-transform:uppercase;user-select:text;-webkit-user-select:text}
.codein:focus{outline:none;border-color:var(--gold)}
.code{font:400 44px var(--disp);letter-spacing:.3em;padding-left:.3em;color:var(--gold)}.code.big{font-size:68px;background:var(--panel);border-radius:22px;padding:14px 0 14px .3em;border:2px dashed rgba(255,210,63,.5)}
.dots4{display:flex;justify-content:center;gap:10px}.dots4 i{width:14px;height:14px;border-radius:50%;animation:bob 1.2s ease-in-out infinite}
.dots4 i:nth-child(2){animation-delay:.15s}.dots4 i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-8px)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);background:#fff;color:#0b0d1f;font-weight:900;padding:12px 18px;border-radius:12px;z-index:90;animation:in .25s;max-width:90vw;text-align:center}
.btn[disabled]{cursor:default}
.toast{pointer-events:none}
.btn small{display:block;font:800 12px var(--body);opacity:.85;letter-spacing:0}
.topbar{padding-right:50px;gap:10px}.topbar .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* nombres */
.namef{display:flex;align-items:center;gap:12px;background:var(--bg2);border-radius:14px;padding:12px;border-left:6px solid var(--c)}
.namef input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:800 20px var(--body);user-select:text;-webkit-user-select:text}
.namef input:focus{outline:none}
/* resultado */
.trophy{width:120px;height:120px;margin:0 auto;display:block;animation:pop .6s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}to{transform:none}}
.winner{font-size:44px;text-align:center;line-height:1}
.score{display:flex;justify-content:center;align-items:center;gap:18px;font:400 64px var(--disp)}
.score span:first-child{color:var(--p1)}.score span:last-child{color:var(--p2)}.score i{font-style:normal;color:var(--dim);font-size:40px}
/* juego */
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:none;z-index:40}
#cv.on{display:block}
#pause{position:fixed;inset:0;z-index:60;background:rgba(8,10,26,.86);display:none;place-items:center;padding:24px}
#pause.on{display:grid}
#pause .box{width:min(340px,100%);display:grid;gap:12px;text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
#mute{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:50;width:40px;height:40px;border-radius:12px;border:0;background:var(--panel);color:#fff;display:grid;place-items:center;cursor:pointer}
body.playing #mute{display:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="app"></main>
<canvas id="cv"></canvas>
<div id="pause"><div class="box">
  <h2 style="font-size:40px">Pausa</h2>
  <p class="dim" id="pz-who" style="font-weight:800"></p>
  <button class="btn green" id="pz-go">CONTINUAR</button>
  <button class="btn ghost" id="pz-re">Reiniciar partida</button>
  <button class="btn ghost" id="pz-q">Salir al menú</button>
</div></div>
<canvas id="fx"></canvas>
<button id="mute" aria-label="Sonido"></button>
<script>
"use strict";
/* =====================================================================
   ARENA MINI 2 · juegos de acción para 2 personas en el mismo celular
   - Motor: un <canvas> a pantalla completa, bucle con requestAnimationFrame
   - Jugador 1 (Rojo) abajo, Jugador 2 (Azul) arriba: su zona se dibuja
     girada 180° para que la lea quien está sentado enfrente.
   - Cada juego = { id, name, need, pads, lay(), newRound(first),
                    update(dt, live), draw(), hud(i,w,h)?, view(i,f) }
   ===================================================================== */
const $ = (q, el = document) => el.querySelector(q);
const h = html => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const rnd = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, TAU = Math.PI * 2;
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const COL = ["#ff5a5f", "#3da9fc"], COL_D = ["#c0353b", "#1f74bd"], COL_L = ["#ffc2c3", "#c3e4ff"];
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

const KEY = "arena-mini-2";
let S = Object.assign({ names: ["Rojo", "Azul"], wins: {}, muted: false, me: "", onl: [0, 0] },
  (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } })());
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
const nm = i => (E.net && NET.names[i]) || S.names[i] || (i ? "Azul" : "Rojo");
const ONL = () => !!E.net, ROT = () => !!E.net && E.net.me === 1;

/* ---------------- sonido sintetizado ---------------- */
let ac = null, master = null, noiseBuf = null;
function audio() {
  if (!ac) {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return null;
    ac = new A(); master = ac.createGain(); master.gain.value = .9;
    const cp = ac.createDynamicsCompressor(); master.connect(cp).connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ac.state !== "running") ac.resume().catch(() => {});
  return ac;
}
addEventListener("pointerdown", () => { try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch {} audio(); }, { once: true });
function tone(f, d = .12, type = "sine", v = .2, delay = 0, to = null) {
  if (S.muted) return; const c = audio(); if (!c) return;
  const t = c.currentTime + .01 + delay, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(master); o.start(t); o.stop(t + d + .05);
}
function noise(d, v, f0, f1, delay = 0) {
  if (S.muted) return; const c = audio(); if (!c) return;
  const t = c.currentTime + .01 + delay, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
  s.buffer = noiseBuf; fl.type = "lowpass"; fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(fl).connect(g).connect(master); s.start(t); s.stop(t + d + .05);
}
let lastSnd = {};
const lim = (k, ms, f) => { const n = performance.now(); if (n - (lastSnd[k] || 0) < ms) return; lastSnd[k] = n; f(); };
const sfx = {
  tap: () => tone(520, .06, "triangle", .14, 0, 820),
  count: n => tone(n ? 440 : 880, n ? .12 : .35, "square", .12),
  boom: () => lim("boom", 60, () => { noise(.7, .6, 2600, 70); tone(95, .45, "sine", .4, 0, 38); }),
  place: () => tone(170, .09, "triangle", .25, 0, 110),
  pick: () => [660, 880, 1320].forEach((f, i) => tone(f, .1, "triangle", .16, i * .05)),
  die: () => { tone(620, .55, "sawtooth", .1, 0, 60); noise(.3, .25, 1500, 200); },
  shoot: () => lim("sh", 40, () => tone(1300, .1, "square", .05, 0, 260)),
  hit: () => { noise(.18, .4, 3500, 300); tone(240, .18, "square", .1, 0, 80); },
  block: () => lim("bl", 50, () => noise(.08, .25, 1800, 500)),
  shield: () => tone(900, .2, "sine", .15, 0, 1800),
  puck: v => lim("pk", 35, () => tone(260 + v * 2, .05, "triangle", clamp(.08 + v / 900, .08, .3))),
  wall: () => lim("wl", 40, () => tone(180, .05, "triangle", .1)),
  goal: () => { noise(.4, .3, 4000, 600); [523, 784, 1047].forEach((f, i) => tone(f, .2, "square", .1, i * .08)); },
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .22, "triangle", .2, i * .09)),
  lose: () => [392, 330, 262].forEach((f, i) => tone(f, .25, "triangle", .15, i * .12)),
  fan: () => [392, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, .26, "square", .08, i * .12)),
  sudden: () => [880, 660, 880, 660].forEach((f, i) => tone(f, .14, "square", .1, i * .16)),
};
const $mute = $("#mute");
const drawMute = () => $mute.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/>${S.muted ? '<path d="M17 9l5 6M22 9l-5 6"/>' : '<path d="M17 8.5a5 5 0 0 1 0 7M19.5 6a8.5 8.5 0 0 1 0 12"/>'}</svg>`;
$mute.onclick = () => { S.muted = !S.muted; save(); drawMute(); };
drawMute();
document.addEventListener("pointerdown", e => { if (e.target.closest(".btn,.gcard,.back")) sfx.tap(); });

/* ---------------- lienzo y utilidades de dibujo ---------------- */
const cv = $("#cv"), cx = cv.getContext("2d");
let W = innerWidth, H = innerHeight, DPR = 1;
function resize() { DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); }
addEventListener("resize", resize); resize();
const FD = px => `400 ${px}px "Lilita One","Arial Rounded MT Bold",sans-serif`, FB = px => `900 ${px}px Nunito,"Segoe UI",sans-serif`;
function txt(s, x, y, px, col = "#fff", al = "center", font = FD) { cx.font = font(px); cx.fillStyle = col; cx.textAlign = al; cx.textBaseline = "middle"; cx.fillText(s, x, y); }
function rr(x, y, w, hh, r) { cx.beginPath(); cx.roundRect ? cx.roundRect(x, y, w, hh, r) : cx.rect(x, y, w, hh); }
function circ(x, y, r) { cx.beginPath(); cx.arc(x, y, r, 0, TAU); }
function upTxt(s, x, y, px, col) { cx.save(); cx.translate(x, y); if (ROT()) cx.rotate(Math.PI); txt(s, 0, 0, px, col); cx.restore(); }

/* íconos dibujados (centro x,y; tamaño s) */
function icBomb(x, y, s) {
  cx.fillStyle = "#15151c"; circ(x, y + s * .08, s * .38); cx.fill();
  cx.fillStyle = "rgba(255,255,255,.35)"; circ(x - s * .13, y - s * .05, s * .1); cx.fill();
  cx.strokeStyle = "#caa36b"; cx.lineWidth = Math.max(1, s * .08); cx.lineCap = "round";
  cx.beginPath(); cx.moveTo(x + s * .18, y - s * .2); cx.quadraticCurveTo(x + s * .25, y - s * .38, x + s * .36, y - s * .38); cx.stroke();
  cx.fillStyle = "#ffd23f"; circ(x + s * .38, y - s * .4, s * .09); cx.fill();
}
function icFire(x, y, s) {
  cx.fillStyle = "#ff7a1a"; cx.beginPath(); cx.moveTo(x, y + s * .45);
  cx.bezierCurveTo(x - s * .42, y + s * .4, x - s * .38, y - s * .05, x - s * .1, y - s * .45);
  cx.bezierCurveTo(x - s * .05, y - s * .15, x + s * .12, y - s * .1, x + s * .12, y - s * .3);
  cx.bezierCurveTo(x + s * .42, y - s * .05, x + s * .42, y + s * .4, x, y + s * .45); cx.fill();
  cx.fillStyle = "#ffd23f"; cx.beginPath(); cx.moveTo(x, y + s * .42); cx.bezierCurveTo(x - s * .2, y + s * .38, x - s * .18, y + s * .1, x, y - s * .05); cx.bezierCurveTo(x + s * .18, y + s * .1, x + s * .2, y + s * .38, x, y + s * .42); cx.fill();
}
function icBolt(x, y, s) {
  cx.fillStyle = "#ffd23f"; cx.beginPath();
  [[.1, -.48], [-.28, .06], [-.02, .06], [-.12, .48], [.3, -.1], [.04, -.1]].forEach(([a, b], k) => k ? cx.lineTo(x + a * s, y + b * s) : cx.moveTo(x + a * s, y + b * s));
  cx.closePath(); cx.fill();
}
function icHeart(x, y, s, col = "#ff4d6d") {
  cx.fillStyle = col; cx.beginPath(); cx.moveTo(x, y + s * .4);
  cx.bezierCurveTo(x - s * .55, y + s * .02, x - s * .45, y - s * .45, x, y - s * .18);
  cx.bezierCurveTo(x + s * .45, y - s * .45, x + s * .55, y + s * .02, x, y + s * .4); cx.fill();
}
function icShield(x, y, s) {
  cx.fillStyle = "#62e8ff"; cx.beginPath(); cx.moveTo(x, y - s * .45); cx.lineTo(x + s * .38, y - s * .3); cx.quadraticCurveTo(x + s * .36, y + s * .22, x, y + s * .46);
  cx.quadraticCurveTo(x - s * .36, y + s * .22, x - s * .38, y - s * .3); cx.closePath(); cx.fill();
  cx.fillStyle = "rgba(255,255,255,.45)"; cx.beginPath(); cx.moveTo(x, y - s * .3); cx.lineTo(x + s * .22, y - s * .2); cx.quadraticCurveTo(x + s * .2, y + s * .12, x, y + s * .28); cx.closePath(); cx.fill();
}
function icTriple(x, y, s) {
  cx.strokeStyle = "#ffd23f"; cx.lineWidth = Math.max(1.5, s * .12); cx.lineCap = "round";
  [-1, 0, 1].forEach(k => { cx.beginPath(); cx.moveTo(x + k * s * .1, y + s * .35); cx.lineTo(x + k * s * .32, y - s * .35); cx.stroke(); });
}

/* ---------------- partículas (coordenadas de pantalla) ---------------- */
let PS = [];
function burst(x, y, n, col, sp = 160, sz = 4, life = .6, g = 0) {
  for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * (.3 + Math.random() * .7);
    PS.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: life * (.6 + Math.random() * .4), m: life, sz: sz * (.6 + Math.random() * .7), c: Array.isArray(col) ? col[k % col.length] : col, g }); }
}
function stepParts(dt) { for (const p of PS) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.vx *= .965; p.vy *= .965; p.l -= dt; } PS = PS.filter(p => p.l > 0); }

/* =====================================================================
   MOTOR DE PARTIDA
   st: off → count (3·2·1) → play → end (banner) → count … → resultado
   ===================================================================== */
const E = { st: "off", game: null, t: 0, wins: [0, 0], first: true, lw: -1, go: 0, shake: 0, prev: null, net: null };
function startMatch(g, online) {
  E.net = online ? { role: "host", me: 0 } : null; NETIN.tx = NETIN.mx = NETIN.my = null; Pads.p.forEach(p => { p.nx = p.ny = 0; p.nh = false; });

}

  setTimeout(() => over ? (mine ? sfx.fan() : sfx.lose()) : w >= 0 ? (mine ? (E.game.quick ? sfx.goal() : sfx.win()) : sfx.lose()) : sfx.lose(), E.game.quick ? 0 : 350);

function pause(fromNet) {

/* entrada táctil sobre el lienzo (multitoque con pointerId) */

let lastT = 0;

  const dt = Math.min(.034, Math.max(0, (ts - lastT) / 1000)); lastT = ts;

    g.update(dt, false);
  } else if (E.st === "play") { g.update(dt, true); if (E.go > 0) E.go -= dt; }

    else { const n = 3 - Math.floor((E.t - .5) / .8), f = ((E.t - .5) % .8) / .8; cx.globalAlpha = 1 - f * .6; txt(String(n), w / 2, hh / 2, 70 + (1 - f) * 30, "#fff"); cx.globalAlpha = 1; }
  } else if (E.st === "play" && E.go > 0) { cx.globalAlpha = clamp(E.go / .3, 0, 1); txt("¡YA!", w / 2, hh / 2, 64, "#ffd23f"); cx.globalAlpha = 1; }
  else if (E.st === "end") {

    const big = g.quick ? (me ? "¡GOL!" : "Te anotaron") : w8 < 0 ? "¡EMPATE!" : over ? (me ? "¡GANASTE!" : "Perdiste") : me ? "¡Ronda tuya!" : "Ronda perdida";
    panel(w, hh, 104); txt(big, w / 2, hh / 2 - 16, 34, w8 < 0 ? "#fff" : me ? "#ffd23f" : "#a3a8d4");
    const a = E.wins[i], b = E.wins[1 - i];

/* =====================================================================
   RED · salas con código para jugar cada uno en su celular
   - Principal: WebRTC directo entre los dos celulares (PeerJS, sin servidor propio)
   - Respaldo: relé MQTT público por WebSocket, si la conexión directa falla
   - Pruebas: BroadcastChannel (?local=1, dos pestañas del mismo navegador)

const LIBS = {
  peer: ["https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js", "https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"],
  mqtt: ["https://cdn.jsdelivr.net/npm/mqtt@5.16.0/dist/mqtt.min.js", "https://unpkg.com/mqtt@5.16.0/dist/mqtt.min.js"],

  guestTick(dt) {

  $("#jn", v).onclick = () => {
    nameOk(); const c = ci.value.trim().toUpperCase();
    if (c.length !== 4) { ci.focus(); toast("El código tiene 4 letras o números"); return; }
    S.me = myName(); save(); NET.join(c); joining(c);
  };
}
function joining(code) {
  const v = show(`<div class="grow"></div>
    <div class="center"><div class="dots4"><i style="background:var(--p1)"></i><i style="background:var(--gold)"></i><i style="background:var(--p2)"></i></div></div>
    <h2 class="center" style="font-size:30px">Entrando a la sala</h2>
    <div class="code center">${esc(code)}</div>
    <p class="center dim" style="font-weight:800" id="jst">Conectando con tu amigo…</p>
    <div class="grow"></div><button class="btn ghost" id="cn">Cancelar</button>`);
  $("#cn", v).onclick = () => { NET.reset(); onlineMenu(); };
  setTimeout(() => { const el = $("#jst"); if (el && NET.st === "wait") el.textContent = "Probando otra ruta de conexión…"; }, 6000);
}
NET.ui = ev => {
  if (ev === "notfound") {
    const code = NET.code;
    const v = show(`<div class="grow"></div><h2 class="center" style="font-size:30px">No encontramos la sala</h2>
      <div class="code center">${esc(code)}</div>
      <p class="center dim" style="font-weight:800">Revisa el código, y que tu amigo tenga la sala abierta en su pantalla.</p>
      <div class="grow"></div><button class="btn green" id="rt">INTENTAR OTRA VEZ</button><button class="btn ghost" id="bk">Volver</button>`);
    $("#rt", v).onclick = () => { NET.join(code); joining(code); }; $("#bk", v).onclick = () => onlineMenu();
  } else if (ev === "taken") { NET.host(); lobby(); }
};
function lobby() {
  clearInterval(lobbyTimer);
  const host = NET.role === "host", ok = NET.st === "ok", N = NET.names, code = NET.code;
  const via = NET.active ? (NET.active.kind === "p2p" ? "Conexión directa" : NET.active.kind === "mqtt" ? "Conexión por relé" : "Conexión local") : "";
  let html = `<div class="topbar"><button class="back" id="bk">‹ Salir de la sala</button><span class="label">Sala ${esc(code)}</span></div>`;
  if (host && !ok) html += `
    <h2 style="font-size:34px">Tu sala está lista</h2>
    <p class="dim" style="font-weight:800">Pásale este código a tu amigo, o envíale el link directo:</p>
    <div class="code big center">${esc(code)}</div>
    <button class="btn green" id="wa">ENVIAR POR WHATSAPP</button>
    <button class="btn ghost" id="cp">Copiar link</button>
    <div class="card center" style="display:grid;gap:10px"><div class="dots4"><i style="background:var(--p1)"></i><i style="background:var(--gold)"></i><i style="background:var(--p2)"></i></div>
      <b>Esperando a tu amigo…</b><span class="dim" style="font-size:13px;font-weight:700">Deja esta pantalla abierta. Cuando entre, eligen el juego.</span></div>`;
  else html += `
    <div class="rival">
      <div class="pl"><span class="nm" style="color:var(--p1)">${esc(N[0])}</span><span class="w">${host ? "Tú · anfitrión" : "Anfitrión"}</span></div>
      <div class="vs">VS</div>
      <div class="pl"><span class="nm" style="color:var(--p2)">${esc(N[1])}</span><span class="w">${host ? "Tu amigo" : "Tú"}</span></div>
      <span class="w center" style="grid-column:1/-1" id="png">${via}</span>
    </div>
    <p class="label" style="margin-top:4px">${host ? "Elige un juego" : `${esc(N[0])} está eligiendo el juego…`}</p>
    ${GAMES.map((x, k) => `<button class="gcard" data-k="${k}" style="--c1:${x.c1};--c2:${x.c2}">${ART[x.g.id]}<div><h3>${x.g.name}</h3><p>${host ? x.tag : "Toca para pedir este juego"}</p><div class="tags">${x.tags.map(t => `<span>${t}</span>`).join("")}</div></div></button>`).join("")}`;
  const v = show(html);
  $("#bk", v).onclick = () => { NET.leave(); history.replaceState(null, "", location.pathname + location.search); home(); };
  if (host && !ok) {
    const msg = `¡Juguemos Arena Mini en línea! Entra a mi sala con este link: ${shareURL(code)} (código ${code})`;
    $("#wa", v).onclick = () => window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
    $("#cp", v).onclick = async () => { try { await navigator.clipboard.writeText(shareURL(code)); toast("Link copiado"); } catch { prompt("Copia este link:", shareURL(code)); } };
  }
  v.querySelectorAll(".gcard[data-k]").forEach(b => b.onclick = () => {
    const x = GAMES[+b.dataset.k];
    if (host) { NET.game = x.g.id; NET.send({ k: "pick", game: x.g.id }); info(x, "host"); }
    else { NET.send({ k: "sug", game: x.g.id }); toast(`Le pediste ${x.g.name} a ${N[0]}`); }
  });
  lobbyTimer = setInterval(() => { const el = $("#png"); if (!el) return clearInterval(lobbyTimer); if (NET.rtt) el.textContent = `${via} · ${NET.rtt} ms`; }, 1000);
}
function onNetJoined() { sfx.pick(); vib(60); lobby(); }
function onNetLost() {
  const wasHost = NET.role === "host", code = NET.code; if (E.st !== "off") stopMatch();
  const v = show(`<div class="grow"></div><h2 class="center" style="font-size:30px">Se perdió la conexión</h2>
    <p class="center dim" style="font-weight:800">Puede ser la señal o que tu amigo cerró la app. ${wasHost ? "Puedes abrir la misma sala otra vez." : "Puedes intentar entrar de nuevo."}</p>
    <div class="code center">${esc(code)}</div><div class="grow"></div>
    <button class="btn green" id="rt">${wasHost ? "ABRIR LA SALA OTRA VEZ" : "VOLVER A ENTRAR"}</button><button class="btn ghost" id="bk">Menú</button>`);
  $("#rt", v).onclick = () => { if (wasHost) { NET.host(code); lobby(); } else { NET.join(code); joining(code); } };
  $("#bk", v).onclick = home;
}
function onNetBye() {
  if (E.st !== "off") stopMatch();
  const v = show(`<div class="grow"></div><h2 class="center" style="font-size:30px">Tu amigo salió de la sala</h2><div class="grow"></div><button class="btn green" id="bk">MENÚ</button>`);
  $("#bk", v).onclick = home;
}
function resultOnline(w, sc) {
  const me = NET.me, won = w === me, g = [BOMB, DUEL, HOCKEY].find(x => x.id === NET.game) || E.game || BOMB, host = NET.role === "host", N = NET.names;
  S.onl[won ? 0 : 1]++; save();
  const v = show(`<div style="height:10px"></div>
    <svg class="trophy" viewBox="0 0 120 120"><path d="M30 18h60v22a30 30 0 0 1-60 0z" fill="${won ? "#ffd23f" : "#6b7194"}"/><path d="M30 26H16a14 14 0 0 0 16 20M90 26h14a14 14 0 0 1-16 20" fill="none" stroke="${won ? "#ffd23f" : "#6b7194"}" stroke-width="7"/>
      <rect x="53" y="68" width="14" height="16" fill="${won ? "#e0b21f" : "#565c80"}"/><rect x="36" y="84" width="48" height="12" rx="4" fill="${COL[w]}"/><rect x="30" y="96" width="60" height="10" rx="4" fill="${COL_D[w]}"/></svg>
    <p class="label center">${g.name} · en línea</p>
    <h1 class="winner" style="color:${won ? "#ffd23f" : COL[w]}">${won ? "¡GANASTE!" : `Ganó ${esc(N[w])}`}</h1>
    <div class="score"><span>${sc[0]}</span><i>–</i><span>${sc[1]}</span></div>
    <p class="center dim" style="font-weight:800">${esc(N[0])} vs ${esc(N[1])} · Tu récord en línea: ${S.onl[0]} ganadas, ${S.onl[1]} perdidas</p>
    <div class="grow"></div>
    ${host ? `<button class="btn green" id="re">REVANCHA</button><button class="btn ghost" id="ot">Elegir otro juego</button>`
      : `<button class="btn green" id="rq">PEDIR REVANCHA</button><p class="center dim" style="font-weight:800">Esperando que ${esc(N[0])} elija…</p>`}
    <button class="btn ghost" id="lv">Salir de la sala</button>`);
  if (host) { $("#re", v).onclick = () => startMatch(g, true); $("#ot", v).onclick = () => { NET.send({ k: "lobby" }); lobby(); }; }
  else $("#rq", v).onclick = () => { NET.send({ k: "sug", game: g.id }); toast("Le pediste la revancha"); };
  $("#lv", v).onclick = () => { NET.leave(); home(); };
  if (won) setTimeout(() => confetti(150, innerWidth / 2, innerHeight * .25), 250);
}
/* mensajes de sala (fuera de la partida) */
const _onNetMsg = onNetMsg;
onNetMsg = function (m) {
  if (m.k === "pick" && NET.role === "guest") { const x = GAMES.find(q => q.g.id === m.game); if (x) { NET.game = m.game; if (E.st !== "off") stopMatch(); info(x, "guest"); } return; }
  if (m.k === "start" && NET.role === "guest") NET.game = m.game;
  if (m.k === "sug" && NET.role === "host") { const x = GAMES.find(q => q.g.id === m.game); if (x) { toast(`${NET.names[1]} quiere jugar ${x.g.name}`); sfx.pick(); } return; }
  _onNetMsg(m);
};

window.AM = { E, Pads, BOMB, DUEL, HOCKEY, NET, startMatch, endRound };
/* arranque: si el link trae #sala-XXXX, ir directo a unirse */
(() => { const m = location.hash.match(/sala-([A-Z0-9]{4})/i); if (m) onlineMenu(m[1].toUpperCase()); else home(); })();
function phoneOnline(id, me) {
  const c = COL[me], oc = COL[1 - me], lab = id === "duelo" ? "DISPARAR" : "BOMBA";
  if (id === "hockey") return `<svg class="phone" viewBox="0 0 160 280"><rect x="3" y="3" width="154" height="274" rx="24" fill="#0b0d1f" stroke="#fff4" stroke-width="3"/>
    <rect x="12" y="14" width="136" height="252" rx="16" fill="#0e1d3a" stroke="#62e8ffaa" stroke-width="2"/><path d="M12 140h136" stroke="#62e8ffaa" stroke-width="2"/>
    <rect x="58" y="11" width="44" height="5" fill="${oc}"/><rect x="58" y="264" width="44" height="5" fill="${c}"/>
    <circle cx="80" cy="220" r="14" fill="${c}" stroke="#fff" stroke-width="2"/><circle cx="80" cy="60" r="14" fill="${oc}" stroke="#fff" stroke-width="2"/><circle cx="96" cy="128" r="8" fill="#1a1a24" stroke="#ffd23f" stroke-width="2.5"/>
    <text x="80" y="252" font-size="10" fill="#fff" text-anchor="middle" font-family="Nunito" font-weight="900">TU DEDO AQUÍ</text><text x="80" y="36" font-size="10" fill="#fff" text-anchor="middle" font-family="Nunito" font-weight="900">TU RIVAL</text></svg>`;
  const mid = id === "duelo" ? `<rect x="16" y="232" width="68" height="16" rx="8" fill="#fff2"/><circle cx="46" cy="240" r="7" fill="${c}" stroke="#fff" stroke-width="1.5"/><text x="50" y="261" font-size="9" fill="#fff" text-anchor="middle" font-family="Nunito" font-weight="900">DESLIZA</text>`
    : `<circle cx="42" cy="238" r="15" fill="#fff2"/><circle cx="46" cy="236" r="8" fill="${c}" stroke="#fff" stroke-width="1.5"/><text x="42" y="262" font-size="9" fill="#fff" text-anchor="middle" font-family="Nunito" font-weight="900">MOVER</text>`;
  const board = id === "bombas"
    ? [0, 1, 2, 3, 4, 5, 6].map(y => [0, 1, 2, 3, 4, 5, 6].map(x => `<rect x="${24 + x * 16}" y="${84 + y * 16}" width="16" height="16" fill="${x % 2 && y % 2 ? "#4a5796" : (x * 7 + y * 3) % 5 === 0 ? "#d9774a" : (x + y) % 2 ? "#1a2146" : "#1e264f"}"/>`).join("")).join("") + `<circle cx="32" cy="188" r="6" fill="${c}"/><circle cx="128" cy="92" r="6" fill="${oc}"/>`
    : `<rect x="12" y="80" width="136" height="120" fill="#060919"/><path d="M12 140h136" stroke="#fff3" stroke-dasharray="4 5"/><path d="M80 178l0-20" stroke="${c}" stroke-width="3"/><path d="M80 102l0 20" stroke="${oc}" stroke-width="3"/><path d="M80 182l7 12h-14z" fill="${c}"/><path d="M80 98l7-12h-14z" fill="${oc}"/>`;
  return `<svg class="phone" viewBox="0 0 160 280"><rect x="3" y="3" width="154" height="274" rx="24" fill="#0b0d1f" stroke="#fff4" stroke-width="3"/>
    <rect x="10" y="14" width="140" height="60" rx="12" fill="${oc}22" stroke="${oc}88"/><text x="80" y="40" font-size="10" fill="#fff9" text-anchor="middle" font-family="Nunito" font-weight="900">TU RIVAL</text><text x="80" y="58" font-size="14" fill="${oc}" text-anchor="middle" font-family="Nunito" font-weight="900">${esc(NET.names[1 - me] || "")}</text>
    ${board}<rect x="10" y="206" width="140" height="60" rx="12" fill="${c}33" stroke="${c}"/>${mid}
    <circle cx="120" cy="237" r="15" fill="${c}" stroke="#fff" stroke-width="1.5"/><text x="120" y="262" font-size="9" fill="#fff" text-anchor="middle" font-family="Nunito" font-weight="900">${lab}</text>
    <text x="16" y="219" font-size="9" fill="#fff" font-family="Nunito" font-weight="900">TÚ</text></svg>`;
}
