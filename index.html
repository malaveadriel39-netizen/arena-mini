"use strict";
/* =====================================================================
   ARENA MINI · minijuegos para 1–4 jugadores en el mismo dispositivo
   Arquitectura:
     - Pantallas (inicio, configuración, marcador, podio, solo) en #app
     - Arena en #stage: una "zona" por jugador (las de arriba giran 180°
       para jugar alrededor del celular) + círculo central
     - Cada minijuego = { id, name, how, better, play(A, done) }
       y entrega un valor por jugador; el motor calcula puestos y puntos.
   ===================================================================== */
const $ = (q, el = document) => el.querySelector(q);
const h = html => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const rnd = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rnd(a, b + 1));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const COLORS = ["var(--p1)", "var(--p2)", "var(--p3)", "var(--p4)"], HEX = ["#ff5a5f", "#3da9fc", "#ffd23f", "#2ec4b6"];
const save = () => { try { localStorage.setItem("arena-mini", JSON.stringify(S)); } catch {} };
let S = Object.assign({ names: ["Jugador 1", "Jugador 2", "Jugador 3", "Jugador 4"], np: 2, rounds: 8, best: 0, bests: {}, muted: false },
  (() => { try { return JSON.parse(localStorage.getItem("arena-mini")) || {}; } catch { return {}; } })());

/* ---------------- sonido sintetizado ---------------- */
let ac = null, master = null;
function audio() { if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; ac = new A(); master = ac.createGain(); master.gain.value = .9; const cp = ac.createDynamicsCompressor(); master.connect(cp).connect(ac.destination); } if (ac.state !== "running") ac.resume().catch(() => {}); return ac; }
addEventListener("pointerdown", () => { try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch {} audio(); }, { once: true });
function tone(f, d = .12, type = "sine", v = .2, delay = 0, to = null) {
  if (S.muted) return; const c = audio(); if (!c) return;
  const t = c.currentTime + .01 + delay, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(master); o.start(t); o.stop(t + d + .05);
}
const sfx = {
  tap: () => tone(520, .06, "triangle", .14, 0, 820),
  hit: () => tone(880 + Math.random() * 300, .06, "square", .06),
  good: () => { tone(660, .12, "triangle", .2); tone(990, .16, "triangle", .18, .08); },
  bad: () => { tone(200, .2, "square", .1, 0, 110); },
  tick: () => tone(1000, .05, "square", .06),
  go: () => { tone(523, .1, "square", .12); tone(1047, .25, "square", .12, .1); },
  count: n => tone(n ? 440 : 880, n ? .12 : .3, "square", .12),
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .22, "triangle", .2, i * .09)),
  fan: () => [392, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, .26, "square", .08, i * .12)),

const $mute = $("#mute");
const drawMute = () => $mute.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/>${S.muted ? '<path d="M17 9l5 6M22 9l-5 6"/>' : '<path d="M17 8.5a5 5 0 0 1 0 7M19.5 6a8.5 8.5 0 0 1 0 12"/>'}</svg>`;
$mute.onclick = () => { S.muted = !S.muted; save(); drawMute(); };
drawMute();
document.addEventListener("pointerdown", e => { const b = e.target.closest(".btn,.chip,.back"); if (b) sfx.tap(); });

/* ---------------- íconos ---------------- */
const IC = {
  luz: `<svg class="ic" viewBox="0 0 40 40"><rect x="12" y="3" width="16" height="34" rx="6" fill="#2b2f5a"/><circle cx="20" cy="12" r="5" fill="#ff3b3b"/><circle cx="20" cy="28" r="5" fill="#2cff7a"/></svg>`,
  machaca: `<svg class="ic" viewBox="0 0 40 40"><circle cx="20" cy="22" r="14" fill="#ff5a5f"/><circle cx="20" cy="20" r="14" fill="#ff8a8e"/><path d="M14 4l3 6M26 4l-3 6M20 2v7" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/></svg>`,
  cuenta: `<svg class="ic" viewBox="0 0 40 40"><circle cx="11" cy="12" r="6" fill="#3da9fc"/><circle cx="27" cy="11" r="6" fill="#3da9fc"/><circle cx="19" cy="27" r="6" fill="#3da9fc"/><text x="33" y="36" font-family="Lilita One,sans-serif" font-size="14" fill="#fff" text-anchor="middle">3</text></svg>`,
  colores: `<svg class="ic" viewBox="0 0 40 40"><text x="20" y="27" font-family="Lilita One,sans-serif" font-size="13" fill="#3da9fc" text-anchor="middle">ROJO</text><rect x="4" y="32" width="10" height="5" rx="2" fill="#ff5a5f"/><rect x="15" y="32" width="10" height="5" rx="2" fill="#3da9fc"/><rect x="26" y="32" width="10" height="5" rx="2" fill="#ffd23f"/></svg>`,

  duelo: `<svg class="ic" viewBox="0 0 40 40"><path d="M6 30l12-12 4 4-12 12z" fill="#9b5cff"/><path d="M34 30L22 18l-4 4 12 12z" fill="#2ec4b6"/><circle cx="20" cy="10" r="6" fill="#ff5a5f"/></svg>`,
  mate: `<svg class="ic" viewBox="0 0 40 40"><rect x="4" y="4" width="32" height="32" rx="8" fill="#2ec4b6"/><path d="M12 15h8M16 11v8M24 15h6M12 27h7M24 25h6M24 29h6" stroke="#0e1024" stroke-width="3" stroke-linecap="round"/></svg>`,
  fiesta: `<svg class="ic" viewBox="0 0 40 40"><circle cx="12" cy="14" r="7" fill="#ff5a5f"/><circle cx="28" cy="14" r="7" fill="#3da9fc"/><circle cx="12" cy="29" r="7" fill="#ffd23f"/><circle cx="28" cy="29" r="7" fill="#2ec4b6"/></svg>`,
  solo: `<svg class="ic" viewBox="0 0 40 40"><path d="M20 4l4.5 9.5L35 15l-7.5 7 2 10.5L20 27.5 10.5 32.5l2-10.5L5 15l10.5-1.5z" fill="#fff"/></svg>`,
  crown: `<svg class="crown" viewBox="0 0 44 34"><path d="M3 30L6 8l10 10L22 3l6 15 10-10 3 22z" fill="#ffd23f" stroke="#b8860b" stroke-width="2" stroke-linejoin="round"/><circle cx="22" cy="3" r="2.5" fill="#fff"/></svg>`,
  star: c => `<svg width="52" height="52" viewBox="0 0 40 40"><path d="M20 3l5 10 11 1.6-8 7.8 2 11L20 28l-10 5.4 2-11-8-7.8L15 13z" fill="${c}" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>`,

/* ---------------- efectos (confeti) ---------------- */
const fx = $("#fx"), fc = fx.getContext("2d"); let parts = [];

const stage = $("#stage");
let timers = [];
function clearTimers() { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; }
function buildArena(np, scores, label) {
  clearTimers(); stage.innerHTML = ""; stage.className = np >= 3 ? "on sm" : "on"; $("#app").replaceChildren();
  const W = innerWidth, H = innerHeight, g = 8, mid = 56, zones = [];
  const rects = np === 1 ? [[g, g, W - 2 * g, H - 2 * g, false]]
    : np === 2 ? [[g, H / 2 + mid / 2, W - 2 * g, H / 2 - mid / 2 - g, false], [g, g, W - 2 * g, H / 2 - mid / 2 - g, true]]
    : [[g, H / 2 + mid / 2, W / 2 - 1.5 * g, H / 2 - mid / 2 - g, false], [W / 2 + g / 2, H / 2 + mid / 2, W / 2 - 1.5 * g, H / 2 - mid / 2 - g, false],
       [g, g, W / 2 - 1.5 * g, H / 2 - mid / 2 - g, true], [W / 2 + g / 2, g, W / 2 - 1.5 * g, H / 2 - mid / 2 - g, true]];
  rects.forEach(([x, y, w, hh, flip], i) => {
    const active = i < np;
    const el = h(`<div class="zone${flip ? " flip" : ""}${active ? "" : " off"}" style="left:${x}px;top:${y}px;width:${w}px;height:${hh}px;--c:${COLORS[i]}">
      ${active ? `<div class="zh"><span class="nm"><i></i>${np === 1 ? "DESAFÍO SOLO · " + label : esc(S.names[i])}</span><span class="pts">${scores ? scores[i] : 0}</span></div>` : ""}<div class="zb"></div></div>`);
    if (!active) $(".zb", el).innerHTML = `<div class="logo" style="font-size:30px;opacity:.35">ARENA<span class="mini" style="font-size:18px">MINI</span></div>`;
    stage.appendChild(el); if (active) zones.push({ el, body: $(".zb", el), p: i });
  });
  const center = h(`<div id="center" class="${np === 1 ? "hide" : ""}"></div>`); stage.appendChild(center);
  const quit = h(`<button id="quit" style="${np === 1 ? "top:auto;bottom:16px;transform:none" : ""}">Salir</button>`); stage.appendChild(quit);
  quit.onclick = () => { clearTimers(); stage.classList.remove("on"); stage.innerHTML = ""; home(); };
  const A = {
    zones, center,
    after: (ms, f) => { const t = setTimeout(f, ms); timers.push(t); return t; },
    every: (ms, f) => { const t = setInterval(f, ms); timers.push(t); return t; },
    now: () => performance.now(),
    flash: () => { const f = h(`<div class="flash"></div>`); stage.appendChild(f); setTimeout(() => f.remove(), 420); navigator.vibrate && navigator.vibrate(30); },
  };
  return A;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* Presenta el minijuego en cada zona, cuenta 3-2-1 y lo juega */
function runGame(np, game, label, scores, onDone) {
  const A = buildArena(np, scores, label);
  A.zones.forEach(z => z.body.innerHTML = `${IC[game.id].replace('class="ic"', 'class="ic ib" style="width:64px;height:64px"')}<div class="zt">${game.name}</div><div class="zs">${game.how}</div>`);
  A.center.innerHTML = `<div style="text-align:center;line-height:1">${label}<small>RONDA</small></div>`;
  let n = 3; const cd = () => {
    if (n > 0) { A.center.innerHTML = n; if (np === 1) A.zones[0].body.innerHTML = `<div class="big" style="font-size:120px">${n}</div>`; sfx.count(n); n--; A.after(750, cd); }
    else { A.center.innerHTML = "¡YA!"; sfx.count(0); A.after(400, () => { A.center.innerHTML = `<div style="font-size:26px">${label}</div>`; });
      let finished = false;
      game.play(A, vals => { if (finished) return; finished = true; clearTimers(); stage.classList.add("over"); onDone(A, vals); }); }
  };
  A.after(np === 1 ? 2200 : 2600, cd);
}

/* Ordena resultados → puestos y puntos (1º +3, 2º +1 si hay 3+ jugadores) */
function rank(game, vals) {
  const idx = vals.map((v, i) => i).filter(i => vals[i] != null);
  idx.sort((a, b) => game.better === "low" ? vals[a] - vals[b] : vals[b] - vals[a]);
  const place = vals.map(() => null); let p = 0;
  idx.forEach((i, k) => { if (k > 0 && vals[i] !== vals[idx[k - 1]]) p = k; place[i] = p; });
  if (game.better === "high") idx.forEach(i => { if (vals[i] === 0) place[i] = null; });
  return place.map(pl => pl === 0 ? 3 : pl === 1 && vals.length >= 3 ? 1 : 0).map((pts, i) => ({ pts, place: place[i] }));
}

/* ---------------- modo fiesta ---------------- */
function party(np, rounds) {
  const plan = []; while (plan.length < rounds) plan.push(...shuffle(GAMES));
  const scores = Array(np).fill(0), wins = Array(np).fill(0); let r = 0;
  const next = () => {
    if (r >= rounds) return podium(np, scores, wins);
    const game = plan[r]; r++;
    runGame(np, game, `${r}/${rounds}`, scores, (A, vals) => {
      const res = rank(game, vals.slice(0, np));
      A.zones.forEach((z, k) => { const i = z.p, rr = res[i];
        scores[i] += rr.pts; if (rr.place === 0) wins[i]++;
        const val = vals[i] == null ? "—" : `${vals[i]} ${game.unit}`;
        z.body.appendChild(h(`<div class="res"><div class="zt">${rr.place === 0 ? "¡GANASTE!" : vals[i] == null ? "Fuera" : rr.place === 1 ? "2º lugar" : "Casi…"}</div><div class="zs">${val}</div>${rr.pts ? `<div class="plus">+${rr.pts}</div>` : ""}</div>`));
        const pts = $(".pts", z.el); if (pts) pts.textContent = scores[i]; });
      if (res.some(x => x.place === 0)) sfx.win(); else sfx.bad();
      A.after(2400, () => board(np, scores, r, rounds, next));
    });
  };
  next();
}
function board(np, scores, r, rounds, next) {
  const max = Math.max(1, ...scores), order = scores.map((s, i) => i).sort((a, b) => scores[b] - scores[a]);
  const v = show(`<div class="topbar"><span class="label">Marcador</span><span class="label">Ronda ${r} de ${rounds}</span></div>
    <h2 style="font-size:34px">${r === rounds ? "¡Última ronda terminada!" : r === rounds - 1 ? "¡Queda una ronda!" : "Así van"}</h2>
    <div class="bars">${order.map(i => `<div class="bar" style="--c:${COLORS[i]}"><span class="av">${i + 1}</span><div class="tr"><i style="width:0"></i><span>${esc(S.names[i])}</span></div><b>${scores[i]}</b></div>`).join("")}</div>
    <div class="grow"></div><button class="btn" id="go">${r >= rounds ? "VER GANADOR" : "SIGUIENTE RONDA"}</button>
    <button class="btn ghost" id="q">Terminar partida</button>`);
  requestAnimationFrame(() => setTimeout(() => v.querySelectorAll(".bar").forEach((b, k) => $(".tr i", b).style.width = Math.max(8, scores[order[k]] / max * 100) + "%"), 60));
  $("#go", v).onclick = () => { $("#go", v).onclick = null; next(); }; $("#q", v).onclick = home;
}
function podium(np, scores, wins) {
  const order = scores.map((s, i) => i).sort((a, b) => scores[b] - scores[a] || wins[b] - wins[a]);
  const top = order[0], tie = order.length > 1 && scores[order[1]] === scores[top] && wins[order[1]] === wins[top];
  const cols = [order[1], order[0], order[2]].filter(x => x !== undefined), hgt = { 0: 190, 1: 130, 2: 90 };
  const v = show(`<p class="label center" style="margin-top:10px">Fin de la partida</p>
    <h2 class="center" style="font-size:40px;color:${COLORS[top]}">${tie ? "¡EMPATE!" : "¡GANA " + esc(S.names[top]).toUpperCase() + "!"}</h2>
    <div class="podium">${cols.map(i => { const pl = order.indexOf(i); return `<div class="pod" style="--c:${COLORS[i]}">${pl === 0 ? IC.crown : ""}<div class="who">${esc(S.names[i])}<br><span class="dim" style="font-family:var(--body);font-weight:800;font-size:13px">${scores[i]} pts</span></div><div class="col" style="height:${hgt[pl]}px;animation-delay:${pl === 0 ? .5 : pl === 1 ? .25 : 0}s">${pl + 1}</div></div>`; }).join("")}</div>
    ${order.length === 4 ? `<p class="center dim">4º lugar: ${esc(S.names[order[3]])} · ${scores[order[3]]} pts</p>` : ""}
    <div class="grow"></div><button class="btn p4" id="re">REVANCHA</button><button class="btn ghost" id="hm">Inicio</button>`);
  sfx.fan(); setTimeout(() => confetti(160), 500); setTimeout(() => confetti(100, innerWidth * .2), 1100); setTimeout(() => confetti(100, innerWidth * .8), 1500);
  $("#re", v).onclick = () => party(np, S.rounds); $("#hm", v).onclick = home;
}

/* ---------------- desafío solo ---------------- */
function soloStart() {
  const plan = shuffle(GAMES), res = []; let k = 0;
  const next = () => {
    if (k >= plan.length) return soloEnd(res);
    const game = plan[k]; k++;
    runGame(1, game, `${k}/${plan.length}`, [res.reduce((a, r) => a + r.pts, 0)], (A, vals) => {
      const pts = game.solo(vals[0]); res.push({ g: game, v: vals[0], pts });
      const pe = $(".pts", A.zones[0].el); if (pe) pe.textContent = res.reduce((a, r) => a + r.pts, 0);
      A.zones[0].body.appendChild(h(`<div class="res" style="--c:var(--p3)"><div class="zs">${game.name}</div><div class="plus">+${pts}</div><div class="zs">${vals[0] == null ? "Sin puntos" : vals[0] + " " + game.unit}</div></div>`));
      pts >= 700 ? sfx.win() : pts > 0 ? sfx.good() : sfx.bad();
      A.after(2100, next);
    });
  };
  next();
}
function soloEnd(res) {
  const total = res.reduce((a, r) => a + r.pts, 0), record = total > (S.best || 0);
  if (record) { S.best = total; }
  res.forEach(r => { S.bests[r.g.id] = Math.max(S.bests[r.g.id] || 0, r.pts); }); save();
  const beat = RETO && total > RETO;
  const v = show(`<p class="label center" style="margin-top:10px">Desafío terminado</p>
    <div class="score-big">${total}</div>
    <p class="center" style="font:400 22px var(--disp)">${record ? "¡NUEVO RÉCORD!" : "Tu récord: " + S.best}</p>
    ${RETO ? `<div class="banner">${beat ? "¡Superaste el reto de tu amigo!" : "El reto era " + RETO + ". ¡Inténtalo otra vez!"}</div>` : ""}
    <div class="sg">${res.map(r => `<div class="sgr">${IC[r.g.id]}<span>${r.g.name}</span><b>${r.pts}</b></div>`).join("")}</div>
    <button class="btn p3" id="sh">RETAR A UN AMIGO</button>
    <button class="btn p2" id="re">JUGAR OTRA VEZ</button><button class="btn ghost" id="hm">Inicio</button>`);
  if (record || beat) { sfx.fan(); confetti(160); } else sfx.win();
  $("#re", v).onclick = soloStart; $("#hm", v).onclick = home;
  $("#sh", v).onclick = async () => {
    const url = location.href.split("#")[0] + "#reto" + total, txt = `Saqué ${total} puntos en Arena Mini. ¿Me superas? ${url}`;
    try { if (navigator.share) { await navigator.share({ title: "Arena Mini", text: txt }); return; } } catch { return; }
    try { await navigator.clipboard.writeText(txt); toast("Link copiado. Pégalo en WhatsApp"); } catch { prompt("Copia este mensaje:", txt); }
  };
}
function toast(t) { const el = h(`<div class="toast">${t}</div>`); document.body.appendChild(el); setTimeout(() => el.remove(), 2400); }

addEventListener("resize", () => { if (!stage.classList.contains("on")) sizeFx(); });
home();
</script>
</body>
</html>
