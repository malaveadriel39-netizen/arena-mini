<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d1f">
<title>Arena Mini</title>
<meta name="description" content="Juegos de acción para 2 personas en el mismo celular: Bomba Loca, Duelo Espacial y Hockey Neón.">
<meta property="og:title" content="Arena Mini — reta a un amigo en el mismo celular">
<meta property="og:description" content="Bomba Loca, Duelo Espacial y Hockey Neón. Sin descargar nada.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d1f;--bg2:#141735;--panel:#1b1f42;--line:rgba(255,255,255,.1);--ink:#fff;--dim:#a3a8d4;
  --p1:#ff5a5f;--p2:#3da9fc;--gold:#ffd23f;--ok:#3ddc84;--ac:#9b5cff;
  --disp:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;--body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{font-family:var(--body);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation;
  background:radial-gradient(120% 60% at 50% -10%,#2a2f6b 0%,var(--bg) 60%) fixed}
#app{position:fixed;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.wrap{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0;letter-spacing:.01em}
p{margin:0;line-height:1.45}
.dim{color:var(--dim)}.center{text-align:center}.grow{flex:1}
.logo{font-family:var(--disp);font-size:54px;line-height:.9;text-align:center;letter-spacing:.02em;text-shadow:0 5px 0 rgba(0,0,0,.35)}
.logo .a{color:var(--p1)}.logo .b{color:var(--gold)}.logo .c{color:var(--p2)}.logo .d{color:#2ec4b6}
.logo small{display:block;font-size:30px;color:#fff;letter-spacing:.35em;margin-top:4px;padding-left:.35em}
.btn{appearance:none;border:0;cursor:pointer;font:400 22px var(--disp);letter-spacing:.03em;color:#fff;background:var(--ac);border-radius:18px;padding:17px 20px;
  box-shadow:0 6px 0 rgba(0,0,0,.35),inset 0 -4px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;gap:10px;width:100%;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.green{background:#20b774}.btn.gold{background:var(--gold);color:#2a2100}.btn.ghost{background:var(--panel);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.btn:focus-visible,.gcard:focus-visible,.back:focus-visible{outline:3px solid #fff;outline-offset:3px}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.back{appearance:none;border:0;background:var(--panel);color:#fff;border-radius:12px;padding:10px 14px;font:800 14px var(--body);cursor:pointer}
.label{font:900 12px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px}
/* rivalidad */
.rival{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:12px 14px}
.rival .pl{display:flex;flex-direction:column;gap:2px}.rival .pl:last-child{text-align:right}
.rival .nm{font:400 20px var(--disp)}.rival .w{font:800 12px var(--body);color:var(--dim)}
.rival .vs{font:400 30px var(--disp);letter-spacing:.04em}
.rival button{grid-column:1/-1;appearance:none;border:0;background:transparent;color:var(--dim);font:800 13px var(--body);text-decoration:underline;cursor:pointer;padding:2px}
/* tarjetas de juego */
.gcard{appearance:none;border:0;color:#fff;text-align:left;width:100%;cursor:pointer;display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:center;
  padding:12px;border-radius:24px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 7px 0 rgba(0,0,0,.35),inset 0 -5px 0 rgba(0,0,0,.15);transition:transform .08s}
.gcard:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.gcard svg{width:112px;height:112px;display:block;border-radius:18px}
.gcard h3{font-size:27px;line-height:1}
.gcard p{font:800 14px/1.3 var(--body);opacity:.92;margin-top:6px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tags span{font:900 11px var(--body);letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.25);padding:4px 8px;border-radius:8px}
/* info */
.hero{display:flex;gap:14px;align-items:center}
.hero svg{width:96px;height:96px;flex:none;border-radius:18px}
.hero h2{font-size:36px;line-height:1}
.steps{display:grid;gap:10px}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:var(--panel);border-radius:16px;padding:12px 14px}
.step b.n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ac);font:400 18px var(--disp)}
.step p{font-weight:700}
.goal{background:linear-gradient(90deg,rgba(255,210,63,.18),rgba(255,210,63,.05));border:1px solid rgba(255,210,63,.35);border-radius:16px;padding:12px 14px;font-weight:800}
.phone{display:block;margin:0 auto;width:170px;height:auto}
.setup{display:flex;gap:10px;align-items:center;background:var(--bg2);border-radius:16px;padding:10px 12px;font-weight:800;font-size:14px}
.setup svg{flex:none}
.stick{position:sticky;bottom:0;padding:12px 0 4px;margin-top:4px;background:linear-gradient(transparent,var(--bg) 35%)}
.or{display:flex;align-items:center;gap:10px;color:var(--dim);font:800 13px var(--body)}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.codein{width:100%;background:var(--bg2);border:2px solid var(--line);border-radius:16px;color:#fff;font:400 44px var(--disp);letter-spacing:.35em;text-align:center;padding:10px 0 10px .35em;text-transform:uppercase;user-select:text;-webkit-user-select:text}
.codein:focus{outline:none;border-color:var(--gold)}
.code{font:400 44px var(--disp);letter-spacing:.3em;padding-left:.3em;color:var(--gold)}.code.big{font-size:68px;background:var(--panel);border-radius:22px;padding:14px 0 14px .3em;border:2px dashed rgba(255,210,63,.5)}
.dots4{display:flex;justify-content:center;gap:10px}.dots4 i{width:14px;height:14px;border-radius:50%;animation:bob 1.2s ease-in-out infinite}
.dots4 i:nth-child(2){animation-delay:.15s}.dots4 i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-8px)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);background:#fff;color:#0b0d1f;font-weight:900;padding:12px 18px;border-radius:12px;z-index:90;animation:in .25s;max-width:90vw;text-align:center}
.btn[disabled]{cursor:default}
.toast{pointer-events:none}
.btn small{display:block;font:800 12px var(--body);opacity:.85;letter-spacing:0}
.topbar{padding-right:50px;gap:10px}.topbar .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ===== tarjetas compactas y opciones ===== */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcard.sm{grid-template-columns:1fr;text-align:center;padding:10px;gap:8px}
.gcard.sm svg{width:100%;height:auto;aspect-ratio:1}
.gcard.sm h3{font-size:22px}.gcard.sm .tags{justify-content:center}
.row{display:flex;gap:10px}.row>*{flex:1}
.chip{appearance:none;border:2px solid var(--line);background:var(--bg2);color:#fff;border-radius:14px;padding:12px 0;font:400 22px var(--disp);cursor:pointer}
.chip.on{border-color:#fff;background:var(--ac)}.chip[disabled]{opacity:.45;cursor:default}
/* ===== marco de juegos por turnos ===== */
body.tplay #app{padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 12px)}
.tg{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:10px;position:relative}
.tg-bar{display:flex;align-items:center;gap:10px;padding-right:50px}
.tg-title{font:400 22px var(--disp);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg-score{font:400 22px var(--disp);display:flex;gap:6px;align-items:center}.tg-score i{font-style:normal;color:var(--dim);font-size:14px}
.tg-main{flex:1;display:flex;flex-direction:column}
.tg-ov{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:30;pointer-events:none;width:min(92vw,380px)}
.tg-ban{background:rgba(9,11,28,.94);border:2px solid rgba(255,255,255,.15);border-radius:22px;padding:18px;text-align:center;display:grid;gap:6px;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
.tg-ban b{font:400 34px var(--disp)}.tg-ban.big b{font-size:42px}.tg-ban span{font-weight:800;color:var(--dim)}
.pass{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:30px 10px}
.pass-dot{width:90px;height:90px;border-radius:50%;box-shadow:0 0 0 10px rgba(255,255,255,.08)}
.pass h2{font-size:34px}.pass p{font-weight:800}.pass .btn{max-width:340px}
/* ===== triki ===== */
.tk{display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:6px}
.tk-players{display:flex;gap:10px;width:100%}
.tk-p{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg2);border-radius:16px;padding:8px 12px;border:2px solid transparent;font-weight:900}
.tk-p .mk{width:30px;height:30px}.tk-p small{margin-left:auto;color:var(--dim)}.tk-p.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--bg2))}
.tk-turn{font:400 24px var(--disp);min-height:30px}
.tk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(92vw,400px);aspect-ratio:1}
.tk-c{appearance:none;border:0;border-radius:20px;background:var(--panel);box-shadow:inset 0 -5px 0 rgba(0,0,0,.25);cursor:pointer;padding:12%;display:grid;place-items:center}
.tk-c:not([disabled]):active{transform:scale(.96)}.tk-c[disabled]{cursor:default}
.tk-c.win{background:#3b3060;box-shadow:0 0 0 3px #ffd23f}
.mk{width:100%;height:100%}.mk.draw path,.mk.draw circle{stroke-dasharray:100;stroke-dashoffset:100;animation:dr .35s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
/* ===== ajedrez ===== */
.ch{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.ch-row{display:flex;align-items:center;gap:8px;background:var(--bg2);border-radius:14px;padding:6px 10px;font-weight:900;min-height:44px;border-left:5px solid var(--c)}
.ch-row small{color:var(--dim)}.ch-dot{width:16px;height:16px;border-radius:50%;border:2px solid #888}
.ch-cap{display:flex;flex-wrap:wrap;align-items:center;flex:1;justify-content:flex-end;gap:0}.ch-cap .pc.mini{width:18px;height:18px}.ch-cap em{font-style:normal;color:var(--gold);margin-left:4px}
.ch-turn{background:var(--gold);color:#2a2100;border-radius:8px;padding:3px 8px;font-size:12px}
.ch-board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:min(96vw,62vh,500px);aspect-ratio:1;margin:0 auto;border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.sq{appearance:none;border:0;padding:0;position:relative;display:grid;place-items:center;cursor:pointer;min-width:0;min-height:0;overflow:hidden}
.sq.l{background:#dfe4fb}.sq.d{background:#7b85c4}
.sq.last::before{content:"";position:absolute;inset:0;background:rgba(255,210,63,.45)}
.sq.sel::before{content:"";position:absolute;inset:0;background:rgba(61,220,132,.55)}
.sq.chk::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,40,60,.95) 0,rgba(255,40,60,.4) 55%,transparent 75%)}
.sq.dst::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(20,24,60,.35)}
.sq.cap::after{content:"";position:absolute;inset:6%;border-radius:50%;border:4px solid rgba(20,24,60,.4)}
.pc{width:88%;height:88%;position:relative;z-index:1;filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
.sq .fl,.sq .rk{position:absolute;font:900 9px var(--body);color:rgba(20,24,60,.55);font-style:normal}.sq .fl{right:3px;bottom:1px}.sq .rk{left:3px;top:1px}
.ch-status{text-align:center;font:400 20px var(--disp)}
.ch-promo{position:fixed;inset:0;background:rgba(8,10,26,.8);display:grid;place-items:center;z-index:40}
.ch-promo>div{background:var(--panel);border-radius:20px;padding:16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:320px}
.ch-promo p{width:100%;text-align:center;font:400 22px var(--disp);margin:0}.ch-promo button{width:64px;height:64px;border-radius:14px;border:0;background:#dfe4fb;cursor:pointer}
/* ===== ludo ===== */
.lu{display:flex;flex-direction:column;gap:10px;align-items:center}
.lu-pl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%}
.lu-p{display:flex;align-items:center;gap:6px;background:var(--bg2);border-radius:12px;padding:6px 10px;font-weight:900;font-size:14px;border:2px solid transparent}
.lu-p i{width:12px;height:12px;border-radius:50%;background:var(--c)}.lu-p span{color:var(--dim)}.lu-p.on{border-color:var(--c)}
.lu-wrap{width:min(96vw,58vh,520px);aspect-ratio:1}
.lu-board{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 18px rgba(0,0,0,.4))}
.tok{transition:transform .35s cubic-bezier(.3,1.4,.5,1);cursor:pointer}
.tok .ring{opacity:0}.tok.can .ring{opacity:1;animation:pulse .8s ease-in-out infinite;transform-origin:center}
@keyframes pulse{50%{stroke-width:2.6}}
.lu-ctrl{display:flex;align-items:center;gap:14px;width:100%;max-width:420px}
.lu-die{appearance:none;border:0;background:none;padding:0;width:84px;height:84px;cursor:pointer;flex:none}
.lu-die .die{width:100%;height:100%}.lu-die.go{animation:bob2 1s ease-in-out infinite}.lu-die[disabled]{cursor:default}
@keyframes bob2{50%{transform:translateY(-6px) rotate(-6deg)}}
.lu-msg{display:flex;flex-direction:column;gap:2px}.lu-msg b{font:400 22px var(--disp)}.lu-msg span{font-weight:800;color:var(--dim)}
/* ===== última carta ===== */
.ucg{display:flex;flex-direction:column;gap:10px;flex:1}
.uc-opps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.uc-opp{background:var(--bg2);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid transparent;min-width:96px;font-size:13px}
.uc-opp.on{border-color:var(--c)}.uc-opp b{color:var(--c)}.uc-opp span{color:var(--dim);font-weight:800}
.uc-fan{display:flex}.uc-fan .uc{margin-left:-14px}.uc-fan .uc:first-child{margin-left:0}
.uc-table{display:flex;align-items:center;justify-content:center;gap:26px;padding:10px 0;position:relative}
.uc-pile{appearance:none;border:0;background:none;padding:0;position:relative;cursor:pointer}.uc-pile[disabled]{cursor:default}
.uc-pile small{position:absolute;bottom:-18px;left:0;right:0;text-align:center;color:var(--dim);font-weight:900}
.uc-disc{position:relative;padding:8px;border-radius:22px;box-shadow:0 0 0 4px var(--k),0 0 28px var(--k)}
.uc-col{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font:900 12px var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--k)}
.uc-dir{position:absolute;right:6px;top:0;font-size:28px;color:var(--dim)}
.uc-msg{text-align:center;display:flex;flex-direction:column;gap:2px;margin-top:10px}.uc-msg b{font:400 22px var(--disp)}.uc-msg span{color:var(--dim);font-weight:800;font-size:14px;min-height:18px}
.uc-act{display:flex;gap:10px;justify-content:center;min-height:0}.uc-act .btn{width:auto;padding:12px 22px;font-size:20px}
.uc .btn.uno,.btn.uno{animation:bob2 .7s ease-in-out infinite}
.uc-hand{display:flex;gap:0;overflow-x:auto;padding:22px 10px 8px;scrollbar-width:none;justify-content:safe center}
.uc-hand::-webkit-scrollbar{display:none}
.uc-hand .uc{margin-left:-16px;transition:transform .15s;width:72px;height:108px}.uc-hand .uc .mid{font-size:42px}.uc-hand .uc:first-child{margin-left:0}
.uc-hand.my .uc.ok{transform:translateY(-16px);cursor:pointer;box-shadow:0 0 0 3px #fff,0 8px 18px rgba(0,0,0,.4)}
.uc-hand.my .uc.no{filter:brightness(.55)}.uc-hand .uc.new{outline:3px solid var(--gold)}
.uc-you{text-align:center;font-weight:900;font-size:13px}
.uc{--k:#444;width:64px;height:96px;flex:none;border-radius:12px;background:var(--k);border:3px solid #fff;position:relative;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.35);
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 6px,transparent 6px 14px)}
.uc .tl,.uc .br{position:absolute;font:400 15px var(--disp);line-height:1}.uc .tl{left:6px;top:5px}.uc .br{right:6px;bottom:5px;transform:rotate(180deg)}
.uc .mid{position:absolute;inset:0;display:grid;place-items:center;font:400 38px var(--disp);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.uc .sy{width:34px;height:34px;color:#fff}.uc .tl .sy,.uc .br .sy{width:14px;height:14px}
.uc.wild{background:#23263f}.uc .wh{width:44px;height:44px}.uc .p4{position:absolute;font:400 22px var(--disp);text-shadow:0 2px 0 #000a}
.uc.back{background:#23263f;background-image:repeating-linear-gradient(45deg,rgba(155,92,255,.25) 0 6px,transparent 6px 12px);display:grid;place-items:center}
.uc.back span{font:400 11px var(--disp);letter-spacing:.08em;transform:rotate(-30deg);color:#ffd23f}
.uc.tiny{width:22px;height:32px;border-width:2px;border-radius:5px}.uc.tiny span{display:none}
.uc.big{width:88px;height:130px}.uc.big .mid{font-size:52px}.uc.big .sy{width:46px;height:46px}.uc.big .wh{width:60px;height:60px}
.uc.land{animation:land .3s ease-out}@keyframes land{from{transform:translateY(-40px) rotate(-12deg);opacity:.3}}
.uc.glow{box-shadow:0 0 0 3px var(--gold),0 0 18px var(--gold)}
.uc-pick{position:fixed;inset:0;background:rgba(8,10,26,.85);display:grid;place-items:center;z-index:40}
.uc-pick>div{background:var(--panel);border-radius:22px;padding:18px;display:grid;gap:14px;text-align:center}
.uc-pick p{font:400 24px var(--disp)}.uc-cols{display:grid;grid-template-columns:repeat(2,90px);gap:12px}.uc-cols button{height:90px;border-radius:18px;border:3px solid #fff;cursor:pointer}

/* nombres */
.namef{display:flex;align-items:center;gap:12px;background:var(--bg2);border-radius:14px;padding:12px;border-left:6px solid var(--c)}
.namef input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:800 20px var(--body);user-select:text;-webkit-user-select:text}
.namef input:focus{outline:none}
/* resultado */
.trophy{width:120px;height:120px;margin:0 auto;display:block;animation:pop .6s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}to{transform:none}}
.winner{font-size:44px;text-align:center;line-height:1}
.score{display:flex;justify-content:center;align-items:center;gap:18px;font:400 64px var(--disp)}
.score span:first-child{color:var(--p1)}.score span:last-child{color:var(--p2)}.score i{font-style:normal;color:var(--dim);font-size:40px}
/* juego */
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:none;z-index:40}
#cv.on{display:block}
#pause{position:fixed;inset:0;z-index:60;background:rgba(8,10,26,.86);display:none;place-items:center;padding:24px}
#pause.on{display:grid}
#pause .box{width:min(340px,100%);display:grid;gap:12px;text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
#mute{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:50;width:40px;height:40px;border-radius:12px;border:0;background:var(--panel);color:#fff;display:grid;place-items:center;cursor:pointer}
body.playing #mute{display:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="app"></main>
<canvas id="cv"></canvas>
<div id="pause"><div class="box">
  <h2 style="font-size:40px">Pausa</h2>
  <p class="dim" id="pz-who" style="font-weight:800"></p>
  <button class="btn green" id="pz-go">CONTINUAR</button>
  <button class="btn ghost" id="pz-re">Reiniciar partida</button>
  <button class="btn ghost" id="pz-q">Salir al menú</button>
</div></div>
<canvas id="fx"></canvas>
<button id="mute" aria-label="Sonido"></button>
<script>
"use strict";
/* =====================================================================
   ARENA MINI 2 · juegos de acción para 2 personas en el mismo celular
   - Motor: un <canvas> a pantalla completa, bucle con requestAnimationFrame
   - Jugador 1 (Rojo) abajo, Jugador 2 (Azul) arriba: su zona se dibuja
     girada 180° para que la lea quien está sentado enfrente.
   - Cada juego = { id, name, need, pads, lay(), newRound(first),
                    update(dt, live), draw(), hud(i,w,h)?, view(i,f) }
   ===================================================================== */
const $ = (q, el = document) => el.querySelector(q);
const h = html => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const rnd = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, TAU = Math.PI * 2;
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const COL = ["#ff5a5f", "#3da9fc", "#ffd23f", "#2ec4b6"], COL_D = ["#c0353b", "#1f74bd", "#c9a012", "#1d8c81"], COL_L = ["#ffc2c3", "#c3e4ff", "#fff0b3", "#b8f2ec"];
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

const KEY = "arena-mini-2";
let S = Object.assign({ names: ["Rojo", "Azul"], wins: {}, muted: false, me: "", onl: [0, 0] },
  (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } })());
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
const nm = i => (E.net && NET.names[i]) || S.names[i] || (i ? "Azul" : "Rojo");
const ONL = () => !!E.net, ROT = () => !!E.net && E.net.me === 1 && !(E.game && E.game.noFlip);

/* ---------------- sonido sintetizado ---------------- */
let ac = null, master = null, noiseBuf = null;
function audio() {
  if (!ac) {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return null;
    ac = new A(); master = ac.createGain(); master.gain.value = .9;
    const cp = ac.createDynamicsCompressor(); master.connect(cp).connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ac.state !== "running") ac.resume().catch(() => {});
  return ac;
}
addEventListener("pointerdown", () => { try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch {} audio(); }, { once: true });
function tone(f, d = .12, type = "sine", v = .2, delay = 0, to = null) {
  if (S.muted) return; const c = audio(); if (!c) return;
  const t = c.currentTime + .01 + delay, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(master); o.start(t); o.stop(t + d + .05);
}
function noise(d, v, f0, f1, delay = 0) {
  if (S.muted) return; const c = audio(); if (!c) return;
  const t = c.currentTime + .01 + delay, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
  s.buffer = noiseBuf; fl.type = "lowpass"; fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(fl).connect(g).connect(master); s.start(t); s.stop(t + d + .05);
}
let lastSnd = {};
const lim = (k, ms, f) => { const n = performance.now(); if (n - (lastSnd[k] || 0) < ms) return; lastSnd[k] = n; f(); };
const sfx = {
  tap: () => tone(520, .06, "triangle", .14, 0, 820),
  count: n => tone(n ? 440 : 880, n ? .12 : .35, "square", .12),
  boom: () => lim("boom", 60, () => { noise(.7, .6, 2600, 70); tone(95, .45, "sine", .4, 0, 38); }),
  place: () => tone(170, .09, "triangle", .25, 0, 110),
  pick: () => [660, 880, 1320].forEach((f, i) => tone(f, .1, "triangle", .16, i * .05)),
  die: () => { tone(620, .55, "sawtooth", .1, 0, 60); noise(.3, .25, 1500, 200); },
  shoot: () => lim("sh", 40, () => tone(1300, .1, "square", .05, 0, 260)),
  hit: () => { noise(.18, .4, 3500, 300); tone(240, .18, "square", .1, 0, 80); },
  block: () => lim("bl", 50, () => noise(.08, .25, 1800, 500)),
  shield: () => tone(900, .2, "sine", .15, 0, 1800),
  puck: v => lim("pk", 35, () => tone(260 + v * 2, .05, "triangle", clamp(.08 + v / 900, .08, .3))),
  wall: () => lim("wl", 40, () => tone(180, .05, "triangle", .1)),
  goal: () => { noise(.4, .3, 4000, 600); [523, 784, 1047].forEach((f, i) => tone(f, .2, "square", .1, i * .08)); },
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .22, "triangle", .2, i * .09)),
  lose: () => [392, 330, 262].forEach((f, i) => tone(f, .25, "triangle", .15, i * .12)),
  fan: () => [392, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, .26, "square", .08, i * .12)),
  sudden: () => [880, 660, 880, 660].forEach((f, i) => tone(f, .14, "square", .1, i * .16)),
};
const $mute = $("#mute");
const drawMute = () => $mute.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/>${S.muted ? '<path d="M17 9l5 6M22 9l-5 6"/>' : '<path d="M17 8.5a5 5 0 0 1 0 7M19.5 6a8.5 8.5 0 0 1 0 12"/>'}</svg>`;
$mute.onclick = () => { S.muted = !S.muted; save(); drawMute(); };
drawMute();
document.addEventListener("pointerdown", e => { if (e.target.closest(".btn,.gcard,.back")) sfx.tap(); });

/* ---------------- lienzo y utilidades de dibujo ---------------- */
const cv = $("#cv"), cx = cv.getContext("2d");
let W = innerWidth, H = innerHeight, DPR = 1;
function resize() { DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); }
addEventListener("resize", resize); resize();
const FD = px => `400 ${px}px "Lilita One","Arial Rounded MT Bold",sans-serif`, FB = px => `900 ${px}px Nunito,"Segoe UI",sans-serif`;
function txt(s, x, y, px, col = "#fff", al = "center", font = FD) { cx.font = font(px); cx.fillStyle = col; cx.textAlign = al; cx.textBaseline = "middle"; cx.fillText(s, x, y); }
function rr(x, y, w, hh, r) { cx.beginPath(); cx.roundRect ? cx.roundRect(x, y, w, hh, r) : cx.rect(x, y, w, hh); }
function circ(x, y, r) { cx.beginPath(); cx.arc(x, y, r, 0, TAU); }
function upTxt(s, x, y, px, col) { cx.save(); cx.translate(x, y); if (ROT()) cx.rotate(Math.PI); txt(s, 0, 0, px, col); cx.restore(); }

/* íconos dibujados (centro x,y; tamaño s) */
function icBomb(x, y, s) {
  cx.fillStyle = "#15151c"; circ(x, y + s * .08, s * .38); cx.fill();
  cx.fillStyle = "rgba(255,255,255,.35)"; circ(x - s * .13, y - s * .05, s * .1); cx.fill();
  cx.strokeStyle = "#caa36b"; cx.lineWidth = Math.max(1, s * .08); cx.lineCap = "round";
  cx.beginPath(); cx.moveTo(x + s * .18, y - s * .2); cx.quadraticCurveTo(x + s * .25, y - s * .38, x + s * .36, y - s * .38); cx.stroke();
  cx.fillStyle = "#ffd23f"; circ(x + s * .38, y - s * .4, s * .09); cx.fill();
}
function icFire(x, y, s) {
  cx.fillStyle = "#ff7a1a"; cx.beginPath(); cx.moveTo(x, y + s * .45);
  cx.bezierCurveTo(x - s * .42, y + s * .4, x - s * .38, y - s * .05, x - s * .1, y - s * .45);
  cx.bezierCurveTo(x - s * .05, y - s * .15, x + s * .12, y - s * .1, x + s * .12, y - s * .3);
  cx.bezierCurveTo(x + s * .42, y - s * .05, x + s * .42, y + s * .4, x, y + s * .45); cx.fill();
  cx.fillStyle = "#ffd23f"; cx.beginPath(); cx.moveTo(x, y + s * .42); cx.bezierCurveTo(x - s * .2, y + s * .38, x - s * .18, y + s * .1, x, y - s * .05); cx.bezierCurveTo(x + s * .18, y + s * .1, x + s * .2, y + s * .38, x, y + s * .42); cx.fill();
}
function icBolt(x, y, s) {
  cx.fillStyle = "#ffd23f"; cx.beginPath();
  [[.1, -.48], [-.28, .06], [-.02, .06], [-.12, .48], [.3, -.1], [.04, -.1]].forEach(([a, b], k) => k ? cx.lineTo(x + a * s, y + b * s) : cx.moveTo(x + a * s, y + b * s));
  cx.closePath(); cx.fill();
}
function icHeart(x, y, s, col = "#ff4d6d") {
  cx.fillStyle = col; cx.beginPath(); cx.moveTo(x, y + s * .4);
  cx.bezierCurveTo(x - s * .55, y + s * .02, x - s * .45, y - s * .45, x, y - s * .18);
  cx.bezierCurveTo(x + s * .45, y - s * .45, x + s * .55, y + s * .02, x, y + s * .4); cx.fill();
}
function icShield(x, y, s) {
  cx.fillStyle = "#62e8ff"; cx.beginPath(); cx.moveTo(x, y - s * .45); cx.lineTo(x + s * .38, y - s * .3); cx.quadraticCurveTo(x + s * .36, y + s * .22, x, y + s * .46);
  cx.quadraticCurveTo(x - s * .36, y + s * .22, x - s * .38, y - s * .3); cx.closePath(); cx.fill();
  cx.fillStyle = "rgba(255,255,255,.45)"; cx.beginPath(); cx.moveTo(x, y - s * .3); cx.lineTo(x + s * .22, y - s * .2); cx.quadraticCurveTo(x + s * .2, y + s * .12, x, y + s * .28); cx.closePath(); cx.fill();
}
function icTriple(x, y, s) {
  cx.strokeStyle = "#ffd23f"; cx.lineWidth = Math.max(1.5, s * .12); cx.lineCap = "round";
  [-1, 0, 1].forEach(k => { cx.beginPath(); cx.moveTo(x + k * s * .1, y + s * .35); cx.lineTo(x + k * s * .32, y - s * .35); cx.stroke(); });
}

/* ---------------- partículas (coordenadas de pantalla) ---------------- */
let PS = [];
function burst(x, y, n, col, sp = 160, sz = 4, life = .6, g = 0) {
  for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * (.3 + Math.random() * .7);
    PS.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: life * (.6 + Math.random() * .4), m: life, sz: sz * (.6 + Math.random() * .7), c: Array.isArray(col) ? col[k % col.length] : col, g }); }
}
function stepParts(dt) { for (const p of PS) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.vx *= .965; p.vy *= .965; p.l -= dt; } PS = PS.filter(p => p.l > 0); }
function drawParts() { for (const p of PS) { cx.globalAlpha = clamp(p.l / p.m, 0, 1); cx.fillStyle = p.c; cx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz); } cx.globalAlpha = 1; }

/* =====================================================================
   CONTROLES TÁCTILES: cada jugador tiene una zona (abajo/arriba).
   Lado izquierdo de SU zona = joystick/deslizador · lado derecho = botón.
   Coordenadas locales (u,v): v=0 junto al tablero, v=ch en su borde.
   ===================================================================== */
const Pads = {
  ch: 160,
  p: [0, 1].map(() => ({ stick: null, btn: null, fire: 0, drag: 0, kx: 0, ky: 0, kf: false, nx: 0, ny: 0, nh: false })),
  reset() { this.p.forEach(p => { p.stick = null; p.btn = null; p.fire = 0; p.drag = 0; }); },
  zoneOf(y) { return y > H - this.ch ? 0 : y < this.ch ? 1 : -1; },
  loc(i, x, y) { return i === 0 ? [x, y - (H - this.ch)] : [W - x, this.ch - y]; },
  R() { return clamp(this.ch * .2, 30, 46); },
  down(id, x, y) {
    const i = this.zoneOf(y); if (i < 0 || (E.net && i !== E.net.me)) return;
    const p = this.p[i], [u, v] = this.loc(i, x, y);
    if (u < W * .55) p.stick = { id, ou: u, ov: v, u, v };
    else { p.btn = { id }; p.fire++; }
  },
  move(id, x, y) {
    this.p.forEach((p, i) => {
      if (!p.stick || p.stick.id !== id) return;
      const [u, v] = this.loc(i, x, y), s = p.stick;
      p.drag += (u - s.u) * (i ? -1 : 1); s.u = u; s.v = v;
      const du = u - s.ou, dv = v - s.ov, d = Math.hypot(du, dv), M = this.R() * 1.35;
      if (d > M) { s.ou = u - du / d * M; s.ov = v - dv / d * M; }   // el joystick "persigue" al dedo
    });
  },
  up(id) { for (const p of this.p) { if (p.stick && p.stick.id === id) p.stick = null; if (p.btn && p.btn.id === id) p.btn = null; } },
  vec(i) {
    const p = this.p[i]; let x = p.kx + p.nx, y = p.ky + p.ny;
    if (p.stick) { const R = this.R(), sg = i ? -1 : 1; x = clamp((p.stick.u - p.stick.ou) / R, -1, 1) * sg; y = clamp((p.stick.v - p.stick.ov) / R, -1, 1) * sg; }
    return { x, y };
  },
  dir4(i) { const v = this.vec(i); if (Math.hypot(v.x, v.y) < .32) return null; return Math.abs(v.x) >= Math.abs(v.y) ? { x: Math.sign(v.x), y: 0 } : { x: 0, y: Math.sign(v.y) }; },
  takeFire(i) { const p = this.p[i], f = p.fire; p.fire = 0; return f > 0; },
  takeDrag(i) { const d = this.p[i].drag; this.p[i].drag = 0; return d; },
  held(i) { return !!this.p[i].btn || this.p[i].kf || this.p[i].nh; },
};
/* teclado (para compu): Rojo = WASD + Espacio · Azul = flechas + Enter */
const KB = { KeyW: [0, 0, -1], KeyS: [0, 0, 1], KeyA: [0, -1, 0], KeyD: [0, 1, 0], ArrowUp: [1, 0, -1], ArrowDown: [1, 0, 1], ArrowLeft: [1, -1, 0], ArrowRight: [1, 1, 0] };
const keys = new Set();
function kbSync() { Pads.p.forEach((p, i) => { p.kx = 0; p.ky = 0; }); const sg = ROT() ? -1 : 1; for (const k of keys) { const m = KB[k]; if (m) { const i = E.net ? E.net.me : m[0]; Pads.p[i].kx += m[1] * sg; Pads.p[i].ky += m[2] * sg; } } }
addEventListener("keydown", e => {
  if (E.st === "off") return;
  if (KB[e.code]) { keys.add(e.code); kbSync(); e.preventDefault(); }
  let f = e.code === "Space" ? 0 : (e.code === "Enter" || e.code === "NumpadEnter") ? 1 : -1; if (f >= 0 && E.net) f = E.net.me;
  if (f >= 0) { if (!e.repeat) Pads.p[f].fire++; Pads.p[f].kf = true; e.preventDefault(); }
  if (e.code === "Escape" || e.code === "KeyP") pause();
});
addEventListener("keyup", e => {
  keys.delete(e.code); kbSync();
  if (e.code === "Space" || e.code === "Enter" || e.code === "NumpadEnter") { if (E.net) Pads.p[E.net.me].kf = false; else Pads.p[e.code === "Space" ? 0 : 1].kf = false; }
});

/* dibuja dentro de la zona del jugador i, ya girada para él */
function withZone(i, f) {
  cx.save();
  if (i === 0) cx.translate(0, H - Pads.ch); else { cx.translate(W, Pads.ch); cx.rotate(Math.PI); }
  if (E.net && i !== E.net.me) { cx.translate(W, Pads.ch); cx.rotate(Math.PI); }   // en línea: todo mirando hacia mí
  f(W, Pads.ch); cx.restore();
}
function zoneBG(i, w, hh) {
  const g = cx.createLinearGradient(0, 0, 0, hh); g.addColorStop(0, rgba(COL[i], .26)); g.addColorStop(1, rgba(COL[i], .08));
  cx.fillStyle = g; cx.fillRect(0, 0, w, hh);
  cx.fillStyle = COL[i]; cx.fillRect(0, 0, w, 3);
}
function nameTag(i, x, y) {
  cx.fillStyle = COL[i]; circ(x + 7, y, 7); cx.fill();
  cx.font = FD(19); const n = nm(i).toUpperCase(); txt(n, x + 20, y + 1, 19, "#fff", "left");
  const nw = cx.measureText(n).width; let dx = x + 30 + nw;
  for (let k = 0; k < E.game.need && E.game.need <= 3; k++) { circ(dx + k * 18, y, 6); cx.fillStyle = k < E.wins[i] ? "#ffd23f" : "rgba(255,255,255,.18)"; cx.fill(); }
}
function drawStick(i, w, hh, mode) {
  const p = Pads.p[i], R = Pads.R();
  if (mode === "slide") {                       // deslizador horizontal (duelo)
    const y = hh * .62, x0 = 22, x1 = w * .55 - 16;
    rr(x0, y - 22, x1 - x0, 44, 22); cx.fillStyle = "rgba(255,255,255,.07)"; cx.fill(); cx.strokeStyle = "rgba(255,255,255,.16)"; cx.lineWidth = 2; cx.stroke();
    cx.fillStyle = "rgba(255,255,255,.45)";
    [[x0 + 16, -1], [x1 - 16, 1]].forEach(([ax, d]) => { cx.beginPath(); cx.moveTo(ax + d * 7, y); cx.lineTo(ax - d * 5, y - 9); cx.lineTo(ax - d * 5, y + 9); cx.closePath(); cx.fill(); });
    if (p.stick) { circ(clamp(p.stick.u, x0 + 18, x1 - 18), y, 18); cx.fillStyle = COL[i]; cx.fill(); cx.strokeStyle = "#fff"; cx.lineWidth = 3; cx.stroke(); }
    else txt("DESLIZA", (x0 + x1) / 2, y + 1, 16, "rgba(255,255,255,.55)");
    return;
  }
  let ou = w * .26, ov = hh * .6, u = ou, v = ov;
  if (p.stick) ({ ou, ov, u, v } = p.stick);
  circ(ou, ov, R + 12); cx.fillStyle = "rgba(255,255,255,.07)"; cx.fill(); cx.strokeStyle = "rgba(255,255,255,.18)"; cx.lineWidth = 2; cx.stroke();
  if (!p.stick) { cx.fillStyle = "rgba(255,255,255,.35)"; for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2; cx.save(); cx.translate(ou + Math.cos(a) * (R + 2), ov + Math.sin(a) * (R + 2)); cx.rotate(a); cx.beginPath(); cx.moveTo(5, 0); cx.lineTo(-3, -6); cx.lineTo(-3, 6); cx.closePath(); cx.fill(); cx.restore(); } }
  let du = u - ou, dv = v - ov; const d = Math.hypot(du, dv); if (d > R) { du *= R / d; dv *= R / d; }
  circ(ou + du, ov + dv, R * .62); cx.fillStyle = COL[i]; cx.fill(); cx.strokeStyle = "rgba(255,255,255,.9)"; cx.lineWidth = 3; cx.stroke();
}
function drawButton(i, w, hh, icon, sub) {
  const bR = clamp(hh * .27, 34, 56), bx = w - bR - 24, by = hh * .6, on = !!Pads.p[i].btn || Pads.p[i].kf, dy = on ? 4 : 0;
  circ(bx, by + 6, bR); cx.fillStyle = COL_D[i]; cx.fill();
  circ(bx, by + dy, bR); cx.fillStyle = COL[i]; cx.fill(); cx.strokeStyle = "rgba(255,255,255,.85)"; cx.lineWidth = 3; cx.stroke();
  icon(bx, by + dy, bR * 1.05);
  if (sub) txt(sub, bx, by + bR + 18 > hh - 8 ? by - bR - 14 : by + bR + 18, 13, "rgba(255,255,255,.75)", "center", FB);
}
function oppZone(i, w, hh, status) {
  const y = hh * .5;
  txt("TU RIVAL · EN LÍNEA", w / 2, y - 6, 12, "rgba(255,255,255,.5)", "center", FB);
  txt(nm(i), w / 2, y + 22, 30, COL[i]);
  if (status) txt(status, w / 2, y + 50, 14, "#ffd23f", "center", FB);
  else if (NET.rtt) { const ms = NET.rtt; txt(`señal: ${ms < 120 ? "excelente" : ms < 250 ? "buena" : "lenta"} · ${ms} ms`, w / 2, y + 50, 12, ms < 120 ? "#3ddc84" : ms < 250 ? "#ffd23f" : "#ff6b6b", "center", FB); }
}
function hintBubble(x, y, s) {
  const a = .6 + .4 * Math.sin(performance.now() / 180);
  cx.font = FB(13); const w = cx.measureText(s).width + 20;
  rr(x - w / 2, y - 14, w, 28, 14); cx.fillStyle = `rgba(255,210,63,${a})`; cx.fill();
  txt(s, x, y + 1, 13, "#2a2100", "center", FB);
}

/* =====================================================================
   MOTOR DE PARTIDA
   st: off → count (3·2·1) → play → end (banner) → count … → resultado
   ===================================================================== */
const E = { st: "off", game: null, t: 0, wins: [0, 0], first: true, lw: -1, go: 0, shake: 0, prev: null, net: null };
function startMatch(g, online) {
  E.net = online ? { role: "host", me: 0 } : null; NETIN.tx = NETIN.mx = NETIN.my = null; Pads.p.forEach(p => { p.nx = p.ny = 0; p.nh = false; });

/* =====================================================================

   - Respaldo: relé MQTT público por WebSocket, si la conexión directa falla
   - Pruebas: BroadcastChannel (?local=1, dos pestañas del mismo navegador)

const LIBS = {

const NET = {

  rate() { return this.active && this.active.kind === "mqtt" ? 66 : 33; },
  reset() {

    this.timers.forEach(clearInterval); this.timers = []; this.st = "off"; this.role = null;
  },
  send(o) { if (this.active) try { this.active.send(o); } catch {} },
  /* ---------- transportes ---------- */
  bc(dir) {

  },
  async peerHost() {
    await loadLib("peer");

/* ---------- el anfitrión recibe controles; el invitado recibe estado ---------- */

/* =====================================================================

/* =====================================================================
   MOTOR POR TURNOS (Triki, Ajedrez, Ludo, Última Carta)
   Cada juego: { id, name, kind:"turn", need, hidden?,
                 init(round, np, opts) → estado (JSON)
                 move(s, p, a) → estado nuevo o null si la jugada no vale
                 winner(s) → índice | -1 (empate) | null (sigue)
                 auto?(s) → { d: ms, a, p? } jugada automática (dados, penalidades)
                 redact?(s, p) → estado sin la info secreta de los demás
                 render(root, s, prev, ctx) }
   Solo el anfitrión (o el celular local) aplica jugadas; el invitado las envía.
   ===================================================================== */
const PNAMES = ["Rojo", "Azul", "Amarillo", "Verde"];
const clone = o => JSON.parse(JSON.stringify(o));
const T = { g: null, s: null, prev: null, online: false, me: null, np: 2, wins: [], round: 0, rover: null, timer: null, opts: {}, reveal: -1, busy: false };
const tname = i => T.online ? (NET.names[i] || PNAMES[i]) : (S.names[i] || PNAMES[i]);

function startTurn(g, online, opts = {}) {
  clearTimeout(T.timer);
  T.g = g; T.online = !!online; T.me = online ? NET.me : null; T.opts = Object.assign({ np: 2 }, opts);
  T.np = online ? 2 : clamp(T.opts.np | 0 || 2, 2, g.maxp || 2); T.wins = Array(T.np).fill(0); T.round = 0; T.reveal = -1;
  if (online) { NET.game = g.id; NET.send({ k: "tstart", game: g.id, opts: T.opts }); }
  tNewRound();
}
function startTurnGuest(g, opts) {
  clearTimeout(T.timer);
  T.g = g; T.online = true; T.me = NET.me; T.opts = opts || {}; T.np = 2; T.wins = [0, 0]; T.s = null; T.prev = null; T.rover = null;
  tFrame(); $(".tg-main").innerHTML = `<div class="center dim" style="padding:40px;font-weight:800">Preparando la partida…</div>`;
}
function tStop() { clearTimeout(T.timer); T.g = null; T.s = null; document.body.classList.remove("tplay"); }
function tNewRound() {
  T.prev = null; T.s = T.g.init(T.round, T.np, T.opts); T.round++; T.rover = null;
  tSync(); tRender(); tAuto();
}
/* una jugada desde la interfaz */
function tAct(a) {
  if (!T.g || !T.s || T.rover) return;
  if (T.online && T.me === 1) { NET.send({ k: "tm", a }); return; }
  const p = T.online ? 0 : (a.p ?? T.s.turn);
  tApply(p, a);
}
function tApply(p, a) {
  const ns = T.g.move(clone(T.s), p, a);
  if (!ns) return false;
  T.prev = T.s; T.s = ns; tAfter(); return true;
}
function tAfter() {
  const w = T.g.winner(T.s);
  if (w !== null && w !== undefined) {
    T.rover = { w }; if (w >= 0) T.wins[w]++;
    const over = w >= 0 && T.wins[w] >= T.g.need;
    T.rover.over = over;
    clearTimeout(T.timer);
    T.timer = setTimeout(() => { if (!T.g) return; over ? tFinish(w) : tNewRound(); }, over ? 2600 : 2400);
  }

}
function tAuto() {
  clearTimeout(T.timer); if (!T.g || !T.s || T.rover) return;
  if (T.online && T.me === 1) return;
  const au = T.g.auto && T.g.auto(T.s);

function tSync() {
  if (!T.online || T.me !== 0) return;

  S.wins[g.id] = S.wins[g.id] || [0, 0, 0, 0]; S.wins[g.id][w] = (S.wins[g.id][w] || 0) + 1; save();

}
/* marco común de la pantalla */

    <div class="tg-bar"><button class="back" id="tq">‹ Salir</button><span class="tg-title"></span><span class="tg-score"></span></div>
    <div class="tg-main"></div><div class="tg-ov"></div></div>`);

      <rect x="53" y="68" width="14" height="16" fill="#e0b21f"/><rect x="36" y="84" width="48" height="12" rx="4" fill="${COL[w]}"/><rect x="30" y="96" width="60" height="10" rx="4" fill="${COL_D[w]}"/></svg>

/* =====================================================================
   TRIKI (tres en raya) · al mejor de 5: gana quien llegue a 3
   ===================================================================== */
const TRIKI = {
  id: "triki", name: "Triki", kind: "turn", need: 3, maxp: 2,

  move(s, p, a) {

function confetti(n, x, y) { for (let i = 0; i < n; i++) parts.push({ x, y, vx: rnd(-7, 7), vy: rnd(-12, -3), l: 1, c: ["#ff5a5f", "#3da9fc", "#ffd23f", "#2ec4b6"][i % 4], s: rnd(5, 10), r: rnd(0, 6), vr: rnd(-.3, .3) }); }

  if (parts.length || fx.dataset.dirty) {

  const v = show(`<div class="grow"></div><h2 class="center" style="font-size:30px">Se perdió la conexión</h2>
    <p class="center dim" style="font-weight:800">Puede ser la señal o que tu amigo cerró la app. ${wasHost ? "Puedes abrir la misma sala otra vez." : "Puedes intentar entrar de nuevo."}</p>
    <div class="code center">${esc(code)}</div><div class="grow"></div>
    <button class="btn green" id="rt">${wasHost ? "ABRIR LA SALA OTRA VEZ" : "VOLVER A ENTRAR"}</button><button class="btn ghost" id="bk">Menú</button>`);
  $("#rt", v).onclick = () => { if (wasHost) { NET.host(code); lobby(); } else { NET.join(code); joining(code); } };
  $("#bk", v).onclick = home;
}
function onNetBye() {
  if (E.st !== "off") stopMatch();
  const v = show(`<div class="grow"></div><h2 class="center" style="font-size:30px">Tu amigo salió de la sala</h2><div class="grow"></div><button class="btn green" id="bk">MENÚ</button>`);
  $("#bk", v).onclick = home;
}
function resultOnline(w, sc) {
  const me = NET.me, won = w === me, g = ALLG().find(x => x.id === NET.game) || E.game || BOMB, host = NET.role === "host", N = NET.names;
  S.onl[won ? 0 : 1]++; save();
  const v = show(`<div style="height:10px"></div>
    <svg class="trophy" viewBox="0 0 120 120"><path d="M30 18h60v22a30 30 0 0 1-60 0z" fill="${won ? "#ffd23f" : "#6b7194"}"/><path d="M30 26H16a14 14 0 0 0 16 20M90 26h14a14 14 0 0 1-16 20" fill="none" stroke="${won ? "#ffd23f" : "#6b7194"}" stroke-width="7"/>
      <rect x="53" y="68" width="14" height="16" fill="${won ? "#e0b21f" : "#565c80"}"/><rect x="36" y="84" width="48" height="12" rx="4" fill="${COL[w]}"/><rect x="30" y="96" width="60" height="10" rx="4" fill="${COL_D[w]}"/></svg>
    <p class="label center">${g.name} · en línea</p>
    <h1 class="winner" style="color:${won ? "#ffd23f" : COL[w]}">${won ? "¡GANASTE!" : `Ganó ${esc(N[w])}`}</h1>
    <div class="score"><span>${sc[0]}</span><i>–</i><span>${sc[1]}</span></div>
    <p class="center dim" style="font-weight:800">${esc(N[0])} vs ${esc(N[1])} · Tu récord en línea: ${S.onl[0]} ganadas, ${S.onl[1]} perdidas</p>
    <div class="grow"></div>
    ${host ? `<button class="btn green" id="re">REVANCHA</button><button class="btn ghost" id="ot">Elegir otro juego</button>`
      : `<button class="btn green" id="rq">PEDIR REVANCHA</button><p class="center dim" style="font-weight:800">Esperando que ${esc(N[0])} elija…</p>`}
    <button class="btn ghost" id="lv">Salir de la sala</button>`);
  if (host) { $("#re", v).onclick = () => launch(g, true, { np: 2, lv: DUO.lv }); $("#ot", v).onclick = () => { NET.send({ k: "lobby" }); lobby(); }; }
  else $("#rq", v).onclick = () => { NET.send({ k: "sug", game: g.id }); toast("Le pediste la revancha"); };
  $("#lv", v).onclick = () => { NET.leave(); home(); };
  if (won) setTimeout(() => confetti(150, innerWidth / 2, innerHeight * .25), 250);
}
/* mensajes de sala (fuera de la partida) */
const _onNetMsg = onNetMsg;
onNetMsg = function (m) {
  if (m.k === "pick" && NET.role === "guest") { const x = GAMES.find(q => q.g.id === m.game); if (x) { NET.game = m.game; if (E.st !== "off") stopMatch(); tStop(); info(x, "guest"); } return; }
  if (m.k === "start" && NET.role === "guest") NET.game = m.game;
  if (m.k === "sug" && NET.role === "host") { const x = GAMES.find(q => q.g.id === m.game); if (x) { toast(`${NET.names[1]} quiere jugar ${x.g.name}`); sfx.pick(); } return; }
  _onNetMsg(m);
};

window.AM = { E, Pads, BOMB, DUEL, HOCKEY, NET, startMatch, endRound, T, TRIKI, CHESS, LUDO, CARDS, DUO, tApply, tAct, launch, S };
/* arranque: si el link trae #sala-XXXX, ir directo a unirse */
(() => { const m = location.hash.match(/sala-([A-Z0-9]{4})/i); if (m) onlineMenu(m[1].toUpperCase()); else home(); })();
function phoneOnline(id, me) {
  const c = COL[me], oc = COL[1 - me], lab = id === "duelo" ? "DISPARAR" : "BOMBA";
  if (id === "hockey") return `<svg class="phone" viewBox="0 0 160 280"><rect x="3" y="3" width="154" height="274" rx="24" fill="#0b0d1f" stroke="#fff4" stroke-width="3"/>
    <rect x="12" y="14" width="136" height="252" rx="16" fill="#0e1d3a" stroke="#62e8ffaa" stroke-width="2"/><path d="M12 140h136" stroke="#62e8ffaa" stroke-width="2"/>
    <rect x="58" y="11" width="44" height="5" fill="${oc}"/><rect x="58" y="264" width="44" height="5" fill="${c}"/>
    <circle cx="80" cy="220" r="14" fill="${c}" stroke="#fff" stroke-width="2"/><circle cx="80" cy="60" r="14" fill="${oc}" stroke="#fff" stroke-width="2"/><circle cx="96" cy="128" r="8" fill="#1a1a24" stroke="#ffd23f" stroke-width="2.5"/>
    <text x="80" y="252" font-size="10" fill="#fff" text-anchor="middle" font-family="Nunito" font-weight="900">TU DEDO AQUÍ</text><text x="80" y="36" font-size="10" fill="#fff" text-anchor="middle" font-family="Nunito" font-weight="900">TU RIVAL</text></svg>`;
  const mid = id === "duelo" ? `<rect x="16" y="232" width="68" height="16" rx="8" fill="#fff2"/><circle cx="46" cy="240" r="7" fill="${c}" stroke="#fff" stroke-width="1.5"/><text x="50" y="261" font-size="9" fill="#fff" text-anchor="middle" font-family="Nunito" font-weight="900">DESLIZA</text>`
    : `<circle cx="42" cy="238" r="15" fill="#fff2"/><circle cx="46" cy="236" r="8" fill="${c}" stroke="#fff" stroke-width="1.5"/><text x="42" y="262" font-size="9" fill="#fff" text-anchor="middle" font-family="Nunito" font-weight="900">MOVER</text>`;
  const board = id === "bombas"
    ? [0, 1, 2, 3, 4, 5, 6].map(y => [0, 1, 2, 3, 4, 5, 6].map(x => `<rect x="${24 + x * 16}" y="${84 + y * 16}" width="16" height="16" fill="${x % 2 && y % 2 ? "#4a5796" : (x * 7 + y * 3) % 5 === 0 ? "#d9774a" : (x + y) % 2 ? "#1a2146" : "#1e264f"}"/>`).join("")).join("") + `<circle cx="32" cy="188" r="6" fill="${c}"/><circle cx="128" cy="92" r="6" fill="${oc}"/>`
    : `<rect x="12" y="80" width="136" height="120" fill="#060919"/><path d="M12 140h136" stroke="#fff3" stroke-dasharray="4 5"/><path d="M80 178l0-20" stroke="${c}" stroke-width="3"/><path d="M80 102l0 20" stroke="${oc}" stroke-width="3"/><path d="M80 182l7 12h-14z" fill="${c}"/><path d="M80 98l7-12h-14z" fill="${oc}"/>`;
  return `<svg class="phone" viewBox="0 0 160 280"><rect x="3" y="3" width="154" height="274" rx="24" fill="#0b0d1f" stroke="#fff4" stroke-width="3"/>
    <rect x="10" y="14" width="140" height="60" rx="12" fill="${oc}22" stroke="${oc}88"/><text x="80" y="40" font-size="10" fill="#fff9" text-anchor="middle" font-family="Nunito" font-weight="900">TU RIVAL</text><text x="80" y="58" font-size="14" fill="${oc}" text-anchor="middle" font-family="Nunito" font-weight="900">${esc(NET.names[1 - me] || "")}</text>
    ${board}<rect x="10" y="206" width="140" height="60" rx="12" fill="${c}33" stroke="${c}"/>${mid}
    <circle cx="120" cy="237" r="15" fill="${c}" stroke="#fff" stroke-width="1.5"/><text x="120" y="262" font-size="9" fill="#fff" text-anchor="middle" font-family="Nunito" font-weight="900">${lab}</text>
    <text x="16" y="219" font-size="9" fill="#fff" font-family="Nunito" font-weight="900">TÚ</text></svg>`;
}
